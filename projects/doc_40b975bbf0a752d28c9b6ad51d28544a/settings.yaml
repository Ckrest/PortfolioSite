blocks:
- body: '## Turn completed work into something people can understand


    Completed work leaves evidence scattered across commits, screenshots, terminal
    sessions, and generated files. Reconstructing that work later means finding the
    material again and remembering why the decisions mattered.


    I built Portfolio Pipeline to connect evidence capture, structured reporting,
    page composition, and publication. My work spans the handoffs between these stages:
    preserving artifacts, carrying their context into Work Reports, mapping useful
    material into editable blocks, and reviewing the page that Portfolio Site will
    render.


    Artifact Pipeline, Work Report, Portfolio Editor, and Portfolio Site provide the
    four components. This project brings them together as one repeatable workflow.'
  id: blk_pipeline_story
  type: text
- code: "flowchart TB\n  CAPTURE[\"1. Capture<br/>Artifact Pipeline<br/>Evidence +\
    \ source records\"]\n  REPORT[\"2. Assemble<br/>Work Report<br/>Structured account\
    \ + retained artifacts\"]\n  CURATE[\"3. Curate<br/>Portfolio Editor<br/>Select\
    \ evidence + compose blocks\"]\n  REVIEW[\"4. Review and publish<br/>Portfolio\
    \ Site validates and builds\"]\n  ACCEPT[\"Owner accepts the exact page\"]\n \
    \ PUBLISH[\"Constellation publishes the reviewed site\"]\n\n  CAPTURE --> REPORT\n\
    \  REPORT --> CURATE\n  CURATE --> REVIEW\n  REVIEW --> ACCEPT\n  ACCEPT --> PUBLISH"
  description: Evidence moves through capture, structured reporting, page composition,
    and exact Site review. Owner acceptance precedes the separate publication step.
  id: blk_pipeline_diagram
  presentation: wide
  sourceMode: inline
  type: mermaid
- body: '## 1. Capture evidence close to the work


    Artifact Pipeline collects outputs from development and visual tools, including
    source changes, screenshots, diagrams, terminal sessions, recordings, and generated
    files. Records retain the connection between each artifact and the operation that
    produced it.


    Work Report copies selected evidence into durable storage. A useful work record
    can therefore outlive a temporary output folder or the session that created it.
    The examples below are artifacts retained with the report behind this page.'
  id: blk_pipeline_capture
  type: text
- description: Examples of the different kinds of evidence the capture stage can preserve.
  fit: contain
