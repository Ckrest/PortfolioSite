blocks:
- body: '## Make a screenshot a precise, repeatable action


    Screenshot Tool combines fullscreen, region, and individual-window capture in
    one hotkey-driven Wayfire workflow. The same modes are available through a command
    line for explicit destinations, silent captures, and structured results.


    The interactive selector freezes the screen while a target is chosen. Live dimensions,
    a magnified pointer view, and one-image-pixel keyboard movement help place an
    exact boundary. A second interactive request saves the already frozen frame fullscreen.'
  id: blk_placeholder
  type: text
- body: '## Keep the service ready and the selector temporary


    A thin D-Bus client sends requests to a persistent GTK4 service. The service moves
    through idle, freezing, selecting, and saving states, creating the UI only for
    an active selection.


    The capture backend supplies a cursor-free raw frame. The service validates its
    layout and pixel contract before displaying it, then keeps the frame unencoded
    until the chosen result reaches the shared output pipeline.'
  id: blk_screenshot_project_service
  type: text
- body: '## Match the selected window exactly


    Window selection joins Wayfire geometry to the capture backend using an opaque
    foreign-toplevel identifier. Same-titled windows remain distinct, and a missing
    identity makes the target unavailable. After the selector closes, the backend
    captures the chosen window directly.


    Each captured display has its own layer-shell surface and viewport into the shared
    frame. The output layout maps logical compositor coordinates across scaled and
    transformed displays.'
  id: blk_screenshot_project_identity
  type: text
- body: '## Keep output behavior consistent


    Interactive and direct requests share encoding, naming, clipboard, notifications,
    sound, and post-save hooks. Files are encoded once and moved atomically into place.
    Directory organization can follow time or application identity, while explicit
    output paths take precedence.


    Configuration reloads at request boundaries, so settings changes apply without
    restarting the service. Notifications can reveal the saved file through the standard
    file-manager interface, and executable hooks let other local workflows respond
    to a completed capture.'
  id: blk_screenshot_project_outputs
  type: text
