blocks:
- body: '## Compose information directly on the desktop


    Desktop HUD turns the Wayfire desktop into a configurable surface for images,
    video, live graphs, gauges, and hotkey panels. I built it to keep useful information
    and controls visible while leaving the desktop available for ordinary work.


    A transparent GTK4 layer-shell window hosts the scene. It normally lets pointer
    input pass through; edit mode makes elements directly movable and resizable, with
    handles and snapping to help arrange them.'
  id: blk_placeholder
  type: text
- description: Edit mode exposes element bounds and resize handles so a scene can
    be arranged in place.
  id: blk_hud_project_edit
  kind: image
  presentation: wide
  src: media/desktop-hud-edit-mode.png
  type: image
- body: '## Make a profile describe the complete scene


    Each profile records an element’s renderer, data provider or media source, opacity,
    and geometry. Loading a profile replaces the active element set, so the scene
    can be reconstructed from its saved definition. Additive profiles merge elements
    by stable ID, allowing a shared base to support several arrangements.


    Bundled layouts, user overrides, and the last-used layout have distinct storage
    roles. The command line and local HTTP API use the same scene model to load profiles
    and add, update, or remove elements.'
  id: blk_hud_project_scenes
  type: text
- body: '## Give each element the right renderer


    Images use GdkPixbuf, video uses explicitly selected GStreamer backends, and graph-lib
    supplies chart and gauge rendering. Separating data providers from rendering lets
    the same scene combine system measurements with media.


    Interactive hotkey panels can show labels, icons, and provider-supplied thumbnails.
    Thumbnail decoding happens away from the UI thread and uses a cache, with text
    or icon fallback when a visual is unavailable.'
  id: blk_hud_project_elements
  type: text
- body: '## Treat compositor support as a requirement


    Desktop HUD checks Wayfire’s topmost-scene IPC support at startup. Its positioning
    and focus behavior depend on that integration, so the application reports missing
    support explicitly. Video also uses an explicit backend choice rather than silently
    changing playback behavior.


    The result is a desktop composition tool with inspectable scene definitions, direct
    manipulation, and an API that other local tools can drive.'
  id: blk_hud_project_wayfire
  type: text
