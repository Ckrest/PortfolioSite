<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Night Mode event loop</title>
  <desc id="desc">A schedule boundary or manual action wakes the service, applies the display state, and returns it to sleep.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171a22"/>
      <stop offset="1" stop-color="#27202d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <text x="112" y="142" fill="#f6f4f8" font-family="Inter,Segoe UI,sans-serif" font-size="60" font-weight="720">Wake only when the state can change</text>
  <text x="112" y="205" fill="#aaa6b3" font-family="Inter,Segoe UI,sans-serif" font-size="28">Scheduled boundaries and manual actions enter the same control loop.</text>

  <g font-family="Inter,Segoe UI,sans-serif" filter="url(#shadow)">
    <rect x="100" y="315" width="370" height="250" rx="30" fill="#242936" stroke="#4c5c73" stroke-width="2"/>
    <circle cx="165" cy="390" r="24" fill="#6db4ff"/>
    <text x="210" y="402" fill="#f5f7fa" font-size="30" font-weight="680">Next boundary</text>
    <text x="165" y="474" fill="#b7c4d2" font-size="23">Blue-light start</text>
    <text x="165" y="515" fill="#b7c4d2" font-size="23">Bedtime · wake</text>

    <rect x="100" y="610" width="370" height="130" rx="30" fill="#302a38" stroke="#775b82" stroke-width="2"/>
    <circle cx="165" cy="675" r="24" fill="#c18fe0"/>
    <text x="210" y="686" fill="#f5f3f8" font-size="30" font-weight="680">Manual action</text>

    <rect x="625" y="365" width="350" height="300" rx="38" fill="#2c342f" stroke="#69b88f" stroke-width="3"/>
    <text x="800" y="444" text-anchor="middle" fill="#a7e7c4" font-size="22" font-weight="750">NIGHT MODE</text>
    <text x="800" y="515" text-anchor="middle" fill="#f6f8f6" font-size="40" font-weight="720">Apply state</text>
    <text x="800" y="562" text-anchor="middle" fill="#b8c6be" font-size="23">Update warmth and timers</text>
    <rect x="698" y="595" width="204" height="40" rx="20" fill="#3a5548"/>
    <text x="800" y="622" text-anchor="middle" fill="#d8f5e5" font-size="18" font-weight="700">RECONCILE</text>

    <rect x="1130" y="420" width="360" height="200" rx="34" fill="#292b35" stroke="#666a79" stroke-width="2"/>
    <path d="M1246 492a52 52 0 1 0 58 68a43 43 0 1 1-58-68Z" fill="#f0bf69"/>
    <text x="1354" y="510" fill="#f6f5f8" font-size="34" font-weight="700">Sleep</text>
    <text x="1354" y="554" fill="#b7b7c0" font-size="22">until signaled</text>
  </g>

  <path d="M470 440H625M470 675H555Q595 675 625 625M975 515H1130" fill="none" stroke="#8c92a2" stroke-width="9" stroke-linecap="round"/>
  <path d="M1310 650V772H800Q735 772 735 705" fill="none" stroke="#5f6874" stroke-width="7" stroke-linecap="round"/>
</svg>
