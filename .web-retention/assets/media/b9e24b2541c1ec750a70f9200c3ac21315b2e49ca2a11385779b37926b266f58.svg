<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Soundboard library workflow</title>
  <desc id="desc">Audio files become named, illustrated cards in a searchable sound library.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171b25"/>
      <stop offset="1" stop-color="#25202d"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <text x="105" y="140" fill="#f7f5fa" font-family="Inter,Segoe UI,sans-serif" font-size="58" font-weight="720">Turn a folder into a usable sound library</text>
  <text x="105" y="202" fill="#b7b3bf" font-family="Inter,Segoe UI,sans-serif" font-size="28">Import, label, illustrate, and find clips without relying on filenames.</text>

  <g font-family="Inter,Segoe UI,sans-serif" filter="url(#shadow)">
    <rect x="105" y="320" width="350" height="330" rx="34" fill="#272d3a" stroke="#5f718d" stroke-width="3"/>
    <rect x="158" y="382" width="244" height="112" rx="20" fill="#1d222d" stroke="#70829d" stroke-width="2"/>
    <path d="M190 438h18l14-32 22 68 21-52 18 32 18-16h69" fill="none" stroke="#77b8f5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="280" y="555" text-anchor="middle" fill="#f4f6fa" font-size="32" font-weight="700">Import audio</text>
    <text x="280" y="600" text-anchor="middle" fill="#aeb8c8" font-size="22">Drop files into the app</text>

    <rect x="625" y="320" width="350" height="330" rx="34" fill="#342b3c" stroke="#9270a7" stroke-width="3"/>
    <rect x="680" y="374" width="240" height="138" rx="24" fill="#614974"/>
    <circle cx="800" cy="430" r="37" fill="#e1a7ee" opacity=".8"/>
    <path d="M744 489l46-42 37 29 31-24 62 60H680Z" fill="#b98aca"/>
    <text x="800" y="555" text-anchor="middle" fill="#f8f3fa" font-size="32" font-weight="700">Name and crop</text>
    <text x="800" y="600" text-anchor="middle" fill="#c7b3cf" font-size="22">Make each clip recognizable</text>

    <rect x="1145" y="320" width="350" height="330" rx="34" fill="#26362f" stroke="#69a984" stroke-width="3"/>
    <rect x="1198" y="375" width="244" height="52" rx="26" fill="#18241e"/>
    <circle cx="1231" cy="401" r="12" fill="none" stroke="#8bcaa6" stroke-width="5"/>
    <path d="M1239 410l13 13" stroke="#8bcaa6" stroke-width="5" stroke-linecap="round"/>
    <rect x="1200" y="461" width="106" height="78" rx="16" fill="#476956"/>
    <rect x="1334" y="461" width="106" height="78" rx="16" fill="#3d5b4b"/>
    <text x="1320" y="584" text-anchor="middle" fill="#f3f8f5" font-size="32" font-weight="700">Search and play</text>
    <text x="1320" y="625" text-anchor="middle" fill="#adc7b8" font-size="22">Use cards instead of filenames</text>
  </g>

  <path d="M455 485H625M975 485H1145" fill="none" stroke="#8f95a3" stroke-width="9" stroke-linecap="round"/>
</svg>
