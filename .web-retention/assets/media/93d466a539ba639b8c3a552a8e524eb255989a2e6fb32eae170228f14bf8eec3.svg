<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><title>Keep the draft moving</title><desc>Draft completeness and structural validity have distinct rules.</desc><rect width="1200" height="675" rx="28" fill="#11171c"/><path d="M64 230 H1136" stroke="#35434b" stroke-width="2"/><text x="64" y="80" fill="#d9b580" font-family="sans-serif" font-size="22" letter-spacing="3">PORTFOLIO AUTHORING</text><text x="64" y="166" fill="#f3eee5" font-family="sans-serif" font-size="55" font-weight="700">Keep the draft moving</text><rect x="64" y="292" width="338" height="200" rx="20" fill="#1d282e" stroke="#526067" stroke-width="2"/><circle cx="102" cy="333" r="13" fill="#d9b580"/><text x="90" y="395" fill="#f3eee5" font-family="sans-serif" font-size="29" font-weight="600">Editable blocks</text><text x="90" y="445" fill="#b3c1c7" font-family="sans-serif" font-size="22">Save work in progress</text><path d="M405 391 h23 m-9 -9 9 9 -9 9" fill="none" stroke="#d9b580" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="431" y="292" width="338" height="200" rx="20" fill="#1d282e" stroke="#526067" stroke-width="2"/><circle cx="469" cy="333" r="13" fill="#d9b580"/><text x="457" y="395" fill="#f3eee5" font-family="sans-serif" font-size="29" font-weight="600">Clear warnings</text><text x="457" y="445" fill="#b3c1c7" font-family="sans-serif" font-size="22">Show missing content</text><path d="M772 391 h23 m-9 -9 9 9 -9 9" fill="none" stroke="#d9b580" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="798" y="292" width="338" height="200" rx="20" fill="#1d282e" stroke="#526067" stroke-width="2"/><circle cx="836" cy="333" r="13" fill="#d9b580"/><text x="824" y="395" fill="#f3eee5" font-family="sans-serif" font-size="29" font-weight="600">Shared rendering</text><text x="824" y="445" fill="#b3c1c7" font-family="sans-serif" font-size="22">One block contract</text><text x="64" y="588" fill="#b3c1c7" font-family="sans-s