<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Model Manager priority queue</title>
  <desc id="desc">Requests enter priority lanes, pass through one scheduler, run against a selected model, and return inspectable status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151823"/>
      <stop offset="1" stop-color="#202b32"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dy="14" stdDeviation="18" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="900" rx="46" fill="url(#bg)"/>
  <text x="100" y="130" fill="#f3f5f7" font-family="Inter,Segoe UI,sans-serif" font-size="58" font-weight="720">One queue for local AI requests</text>
  <text x="100" y="188" fill="#aeb8c0" font-family="Inter,Segoe UI,sans-serif" font-size="27">Priority and model determine order; every job keeps an inspectable state.</text>

  <g font-family="Inter,Segoe UI,sans-serif" filter="url(#shadow)">
    <rect x="100" y="275" width="470" height="430" rx="30" fill="#222733" stroke="#3c4653" stroke-width="2"/>
    <text x="145" y="330" fill="#d7dce1" font-size="24" font-weight="650">QUEUED REQUESTS</text>
    <g transform="translate(145 370)">
      <rect width="380" height="78" rx="18" fill="#3b2942" stroke="#d989b5"/>
      <text x="24" y="31" fill="#f2c3de" font-size="19" font-weight="700">HIGH</text>
      <text x="24" y="59" fill="#fbf5f8" font-size="22">job_42 · model A</text>
    </g>
    <g transform="translate(145 468)">
      <rect width="380" height="78" rx="18" fill="#253849" stroke="#78b6e8"/>
      <text x="24" y="31" fill="#acd5f7" font-size="19" font-weight="700">NORMAL</text>
      <text x="24" y="59" fill="#f5f8fb" font-size="22">job_43 · model B</text>
    </g>
    <g transform="translate(145 566)">
      <rect width="380" height="78" rx="18" fill="#2f3539" stroke="#788189"/>
      <text x="24" y="31" fill="#bcc5cc" font-size="19" font-weight="700">LOW</text>
      <text x="24" y="59" fill="#f5f8fb" font-size="22">job_44 · model A</text>
    </g>

    <path d="M600 490H720" fill="none" stroke="#74c7a4" stroke-width="8" stroke-linecap="round"/>
    <circle cx="600" cy="490" r="8" fill="#74c7a4"/>

    <rect x="720" y="350" width="320" height="280" rx="30" fill="#243630" stroke="#65b893" stroke-width="2"/>
    <text x="880" y="426" text-anchor="middle" fill="#9ee0c2" font-size="21" font-weight="700">SCHEDULER</text>
    <text x="880" y="490" text-anchor="middle" fill="#f5f8f6" font-size="32" font-weight="700">Select next job</text>
    <text x="880" y="538" text-anchor="middle" fill="#b8c8c0" font-size="22">Run one execution plan</text>
    <rect x="792" y="565" width="176" height="34" rx="17" fill="#315b4b"/>
    <text x="880" y="589" text-anchor="middle" fill="#c9f2df" font-size="17">RUNNING</text>

    <path d="M1070 490H1165" fill="none" stroke="#74c7a4" stroke-width="8" stroke-linecap="round"/>
    <rect x="1165" y="350" width="335" height="280" rx="30" fill="#282b38" stroke="#777f9e" stroke-width="2"/>
    <text x="1332" y="426" text-anchor="middle" fill="#bac2e8" font-size="21" font-weight="700">LOCAL MODEL</text>
    <text x="1332" y="490" text-anchor="middle" fill="#f5f6fb" font-size="32" font-weight="700">Execute request</text>
    <text x="1332" y="538" text-anchor="middle" fill="#b9bdcc" font-size="22">Store result and status</text>
    <rect x="1245" y="565" width="174" height="34" rx="17" fill="#373c56"/>
    <text x="1332" y="589" text-anchor="middle" fill="#d8dcf7" font-size="17">COMPLETE</text>
  </g>
</svg>
