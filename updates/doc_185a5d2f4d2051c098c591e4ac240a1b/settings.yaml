blocks:
- body: '## Turn requests into inspectable jobs


    I built Model Manager as one coordination point for tools that needed local Ollama
    inference. Submissions become jobs with explicit pending, queued, running, complete,
    failed, and cancelled states. High, normal, and low priority queues group work
    by requested model before one background scheduler runs the execution plans in
    order.


    HTTP callers can submit a job and poll its result without keeping an inference
    request open. Direct Python callers use the same queue and can cancel work while
    it is still pending or queued.'
  id: blk_editorial_model-manager
  type: text
- code: "flowchart LR\n  HTTP[HTTP client] --> Queue[Priority and model queues]\n\
    \  Python[Python caller] --> Queue\n  Python --> Cancel[Cancel pending or queued\
    \ job]\n  Queue --> Scheduler[Background scheduler]\n  Scheduler --> Engine[Load\
    \ model and run with Ollama]\n  Engine --> Result[Complete or failed]\n  Monitor[GPU\
    \ and loaded-model observation] --> Status[Stats and model listing]\n  Registry[Installed\
    \ model discovery] --> Status"
  description: HTTP and Python callers share one job queue while resource observation
    remains separate from execution.
  id: blk_model_scheduler
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Separate resource observation from execution


    The service reads total, used, and free GPU memory from `nvidia-smi`, then queries
    Ollama for installed and loaded models. Those readings appear in service statistics
    and give the scheduler a consistent view of the machine.


    The scheduler groups work by model, records available memory, loads the requested
    model, and processes queued jobs through a single execution engine. Explicit load
    and unload operations use the same service boundary.'
  id: blk_editorial_model_manager_resources
  type: text
- code: 'POST /api/submit

    → { "job_id": "job_42", "status": "queued" }


    GET /api/job/job_42

    → { "status": "complete", "result": "…" }'
  description: Submission returns a job ID immediately; the same ID exposes its current
    state and eventual result.
  filename: model-manager-http-example.txt
  id: blk_model_manager_http_routes
  language: http
  presentation: content
  sourceMode: inline
  type: code
