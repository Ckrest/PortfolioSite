blocks:
- body: '## Draw the cursor into captured windows


    When a capture session requests `paint_cursors`, the source remembers that preference.
    After each window snapshot, the plugin finds the first visible hardware cursor
    that intersects the view, converts its position from output coordinates using
    the cursor hotspot and output scale, and renders the cursor texture into the snapshot
    buffer.


    The preference is cleared when the last capture session stops, so cursor inclusion
    remains explicit for the active source.'
  id: blk_editorial_wayfire-toplevel-capture
  type: text
- body: '## Complete every frame request


    A failed snapshot still emits a frame event, allowing the copy path to retry and
    return a protocol-level failure if no buffer becomes available. Clients receive
    an explicit outcome instead of waiting indefinitely.


    The buffer-copy helper already owns its failure signal when dimensions or buffer
    state do not match. Avoiding a second failure call prevents the plugin from touching
    a frame after that helper has destroyed it.'
  id: blk_capture_frame_outcomes
  type: text
- code: "flowchart LR\n  Client[Capture session] --> Snapshot[Snapshot window]\n \
    \ Snapshot --> Cursor{Include cursor?}\n  Cursor -->|Yes| Composite[Composite\
    \ visible cursor]\n  Cursor -->|No| Deliver[Emit frame]\n  Composite --> Deliver\n\
    \n  Commit[Output commit] --> Watchdog[Refresh 300 ms watchdog]\n  Watchdog -->|Stalled|\
    \ Fallback[Take fallback snapshot]\n  Fallback --> Deliver\n\n  Move[Window changes\
    \ output] --> Rebind[Rebind output listeners]\n  Rebind --> Constraints[Update\
    \ capture constraints]\n  Constraints --> Deliver"
  description: Capture follows guarded paths for cursor inclusion, stalled output
    commits, and output changes.
  id: blk_capture_watchdog
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Recover when output commits stop


    The first active capture session starts a repeating 300 ms watchdog keyed to the
    latest output commit. When the output stays quiet past that threshold, the plugin
    attempts to recover a missing output, takes a fresh compositor snapshot, composites
    the cursor when requested, and emits a full-damage frame.


    The timer disconnects when the last session stops or when the view, output, or
    capture source is destroyed.'
  id: blk_capture_watchdog_recovery
  type: text
- body: '## Follow the window between outputs


    A view-output change disconnects the capture source from the old output’s commit
    and destroy signals, binds those listeners to the destination output, recalculates
    capture constraints, and announces the updated formats to clients. Reused sources
    also verify that they still point to the window’s active output.


    Docklike can therefore keep tracking the same view while the real window crosses
    monitors. If the view disappears, teardown stops the watchdog and releases the
    listeners before the compositor pointer becomes invalid.'
  id: blk_capture_output_migration
  type: text
