blocks:
- body: '## Add integration at the save boundary


    Diagram Tool and Screenshot Tool expose post-save extension points instead of
    embedding artifact tracking in their core save paths. Diagram Tool calls registered
    Python callbacks after a successful save; Screenshot Tool runs executable scripts
    after writing the capture.'
  id: blk_editorial_hook-systems-and-artifac
  type: text
- id: blk_relationship_context_79633f017206
  label: 'Diagram Tool: the editor behind the diagram save hook'
  type: related-mini
  updateId: doc_79633f0172065a5aaef2a5c4f8d70359
- code: "flowchart LR\n  Diagram[Diagram save] --> PythonHook[Python hook]\n  Screenshot[Screenshot\
    \ save] --> ShellHook[Shell hook]\n  PythonHook & ShellHook --> Event[artifact.created]\n\
    \  Event --> Pipeline[Redis → DB logger → PostgreSQL]\n  Pipeline --> Reports[Work\
    \ Report discovery]"
  description: Python and shell hooks converge on one artifact event, then Redis and
    the database logger place the saved visual in PostgreSQL for Work Report discovery.
  id: blk_visual_hooks
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Route one event into the evidence pipeline


    When the Constellation Framework adapters are present, both hooks publish the
    same `artifact.created` event with the saved path and capture metadata. Redis
    carries the event to the database logger, which records the artifact in PostgreSQL
    for Work Report discovery.


    This keeps each tool focused on producing its visual while the optional adapters
    handle workspace integration.'
  id: blk_visual_tool_event_pipeline
  type: text
date: '2026-01-29'
prominence: low
summary: Added optional post-save adapters that publish Diagram Tool and Screenshot
  Tool outputs into artifact tracking, making the visuals discoverable by Work Report
  while keeping both tools independently runnable.
