content:
  blocks:
  - body: '## Use the report’s project as repository context


      Work Report now carries the project named on a report into every Git lookup.
      When that project maps to a VCSH repository, Git runs through `vcsh <project>`;
      conventional repositories continue through Git directly.


      This connects reporting to Constellation’s package ownership structure, so the
      report selects the repository responsible for the work instead of treating the
      shared filesystem as one Git boundary.'
    id: blk_editorial_work-report-vcsh-support
    type: text
  - caption: The report’s project identity selects one repository route for every
      Git fact and stored piece of evidence.
    code: "flowchart LR\n  Report[Report project identity] --> Route{Repository adapter}\n\
      \  Route -->|Standard repository| Git[Direct Git]\n  Route -->|VCSH package|\
      \ VCSH[Package VCSH repository]\n  Git & VCSH --> Facts[Commit + diff facts]\n\
      \  Facts --> Evidence[Stored report evidence]"
    id: blk_vcsh_reporting
    presentation: content
    sourceMode: inline
    summary: The report’s project identity selects one repository route for every
      Git fact and stored piece of evidence.
    type: mermaid
  - body: '## Keep every recorded Git fact on the same route


      The statistics collector and Git evidence handler now use the same repository
      context for commit lookup, file changes, diff text, and commit messages. The
      numerical summary and retained evidence therefore come from the same package
      history.'
    id: blk_vcsh_aligned_evidence
    type: text
