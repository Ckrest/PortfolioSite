blocks:
- body: '## Let packages register themselves


    I built the package registry for Constellation Framework, my package-and-service
    workspace. Instead of maintaining a separate inventory, each tool or service carries
    a `manifest.yaml` beside its own files. Scanning the workspace produces the package
    index, so adding a manifest makes a package discoverable without another registration
    step.


    The schema gives desktop, AI, infrastructure, and tools packages a common way
    to declare their identity, status, interfaces, runtime, triggers, dependencies,
    and repository details.'
  id: blk_editorial_constellation-registry
  type: text
- code: "flowchart LR\n  Packages[Package directories] --> Manifests[Local manifest\
    \ files]\n  Manifests --> Scan[Scan and parse]\n  Scan --> Index[Generated package\
    \ index]\n  Index --> Search[Find packages]\n  Index --> Details[Inspect runtime\
    \ and dependencies]"
  description: The package inventory is generated from manifests stored beside the
    packages themselves.
  id: blk_legacy_registry
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Give different packages a common shape


    Long-running services, command-line tools, libraries, and graphical applications
    can share one descriptive format without being forced into the same runtime. Templates
    provide starting structures for common package types while leaving each package
    responsible for its own metadata.


    I also defined search, inspection, creation, update, and validation operations
    around the registry. That gives agents and maintenance tools a consistent way
    to discover existing capabilities before creating or changing packages.'
  id: blk_registry_common_shape
  type: text
- code: "name: diagram-tool\ntier: tools\nstatus: active\ndescription: Local-first\
    \ diagram editor\n\ninterfaces:\n  - cli\n  - api\n  - gui\ntriggers:\n  - manual\n\
    runtime: python\ndepends_on: []\ntags:\n  - diagram\n  - automation"
  description: A package describes its identity, interfaces, runtime, and dependencies
    beside its own files.
  filename: example-package-manifest.yaml
  id: blk_registry_manifest
  language: yaml
  presentation: content
  sourceMode: inline
  type: code
- code: "def discover_packages(root: Path):\n    packages = {}\n\n    for manifest_path\
    \ in root.rglob(\"manifest.yaml\"):\n        manifest = yaml.safe_load(manifest_path.read_text())\n\
    \        packages[manifest[\"name\"]] = {\n            \"path\": manifest_path.parent,\n\
    \            \"manifest\": manifest,\n        }\n\n    return packages"
  description: Discovery walks the workspace and builds the registry from the manifests
    it finds.
  filename: discovery.py
  id: blk_registry_operations
  language: python
  presentation: content
  sourceMode: inline
  type: code
