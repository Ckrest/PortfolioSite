content:
  blocks:
  - body: '## Turn requests into inspectable jobs


      I built Model Manager as one coordination point for tools that needed local
      Ollama inference. Submissions became jobs with explicit pending, queued, running,
      complete, failed, and cancelled states. The queue separated high, normal, and
      low priorities and grouped work by requested model before a background scheduler
      handed it to the execution engine.


      HTTP callers could submit a job and poll its result without keeping an inference
      request open. Direct Python callers used the same queue and could also cancel
      work while it was still pending or queued.'
    id: blk_editorial_model-manager
    type: text
  - caption: HTTP and Python callers share one job queue while resource observation
      remains separate from execution.
    code: "flowchart LR\n  HTTP[HTTP client] --> Queue[Priority and model queues]\n\
      \  Python[Python caller] --> Queue\n  Python --> Cancel[Cancel pending or queued\
      \ job]\n  Queue --> Scheduler[Background scheduler]\n  Scheduler --> Engine[Load\
      \ model and run with Ollama]\n  Engine --> Result[Complete or failed]\n  Monitor[GPU\
      \ and loaded-model observation] --> Status[Stats and model listing]\n  Registry[Installed\
      \ model discovery] --> Status"
    id: blk_model_scheduler
    presentation: content
    sourceMode: inline
    summary: HTTP and Python callers share one job queue while resource observation
      remains separate from execution.
    type: mermaid
  - body: '## Separate resource observation from execution


      The service reads total, used, and free GPU memory from `nvidia-smi`, then queries
      Ollama for installed and currently loaded models. Those readings appear in service
      statistics and give the scheduling boundary a consistent view of the machine.


      The scheduling policy groups work by model, logs the available memory, loads
      requested models, and executes jobs from a background thread. Explicit load
      and unload operations are available, but scheduling does not reject oversized
      jobs or automatically choose a loaded model to evict.'
    id: blk_editorial_model_manager_resources
    type: text
  - caption: The HTTP surface separates submission from status, results, model discovery,
      and resource diagnostics.
    code: 'POST /api/submit

      GET  /api/job/<job_id>

      GET  /api/models

      POST /api/models/refresh

      GET  /api/stats

      GET  /api/health'
    filename: model-manager-http-api.txt
    id: blk_model_manager_http_routes
    language: http
    presentation: content
    sourceMode: inline
    type: code
