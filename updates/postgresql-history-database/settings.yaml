content:
  blocks:
  - body: '## Give tool activity a shared data model


      I built a shared history database for Constellation Framework so local tools
      can record operations and the files they consume or produce without inventing
      a separate log format for every integration. PostgreSQL provides transactions,
      relational constraints, time-aware queries, and JSONB fields for tool-specific
      configuration.


      The schema separates operations, artifacts, and tags. An operation stores its
      type, owning tool, optional model, start and completion times, duration, status,
      error, configuration, and an optional parent operation. Artifacts store a stable
      UUID, resolved path, file type, size, checksum, MIME type, timestamp, and flexible
      metadata. Junction tables link inputs, outputs, and tags without copying file
      records into every event.


      ## Preserve lineage, not just a list of events


      The repository supports both long-running and one-shot work. A caller can start
      an operation, register inputs as they become known, attach outputs, and complete
      with success or failure. A convenience path performs the same lifecycle for
      work that has already completed. Artifact registration is idempotent by resolved
      path and computes SHA-256 for files below the configured 100 MB threshold.


      Queries cover recent operations, time ranges, tools, operation types, tags,
      artifact history, and parent-operation chains. The first database run records
      two successful operations at 19:43 on November 16. Its ComfyUI image-generation
      record links `test_prompt.txt` as an input and `test_output.png` as an output,
      exercising operation-to-artifact lineage end to end.


      ## Keep the boundary practical


      SQLAlchemy supplies the model and repository boundary. Alembic is configured
      to generate, apply, and roll back schema migrations. Local connections use peer
      authentication over a PostgreSQL Unix socket, while direct SQL examples and
      `pg_dump`/restore procedures keep the store inspectable outside the Python API.'
