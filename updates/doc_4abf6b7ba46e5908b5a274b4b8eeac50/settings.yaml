blocks:
- body: '## Call the same flows over HTTP


    I exposed the engine’s JSON flows through a FastAPI service. Clients can list
    flows, inspect their inputs and components, validate a request, execute a flow,
    and check service health without importing engine internals. The CLI and HTTP
    service share one execution engine and one flow format.'
  id: blk_editorial_unified-output-destinati
  type: text
- id: blk_relationship_context_d5f1ae0b35e1
  label: 'Modular Flow Engine: JSON plans, components, and resume'
  type: related-mini
  updateId: doc_d5f1ae0b35e150ff97749a0ddbcaa1d8
- code: "flowchart TD\n  Request[HTTP execute request] --> Check{Return destination?}\n\
    \  Check -->|Yes| Wait[Wait for result]\n  Check -->|No| Accept[Accept background\
    \ run]\n  Wait --> Engine[Shared flow engine]\n  Accept --> Engine\n  Engine -->\
    \ Sink{Declared sink destinations}\n  Sink --> Return[API response]\n  Sink -->\
    \ File[JSON file]\n  Sink --> Console[Console output]"
  description: The flow’s sink configuration determines both result delivery and the
    service’s default wait behavior.
  id: blk_flow_engine_http_delivery
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Let sinks choose result delivery


    A collector or JSON writer declares one or more destinations: `return`, `file`,
    or `console`. The service inspects those declarations before execution. A flow
    that returns data waits by default, while file- or console-only work can continue
    in the background; callers can override that choice explicitly.'
  id: blk_flow_engine_sink_delivery
  type: text
- code: "{\n  \"type\": \"sink/collector\",\n  \"config\": {\n    \"destinations\"\
    : [\"return\", \"file\"],\n    \"path\": \"results.json\"\n  }\n}"
  description: One sink can return its completed value to the caller and write the
    same result to a file.
  filename: sink-config.json
  id: blk_output_destinations
  language: json
  presentation: content
  sourceMode: inline
  type: code
