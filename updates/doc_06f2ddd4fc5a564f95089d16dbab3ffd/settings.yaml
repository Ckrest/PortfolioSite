blocks:
- body: '## Give the viewer its own package boundary


    I reorganized the application into a `src/comfy_viewer` package with a `pyproject.toml`,
    console entry point, package-owned dependencies, and a copyable configuration
    template. Runtime paths now come from configuration, environment overrides, and
    platform data and cache directories instead of assumptions about the surrounding
    Constellation Framework checkout.'
  id: blk_editorial_comfy-viewer-generic-sta
  type: text
- code: "flowchart TD\n  Viewer[Comfy Viewer core] --> Config[Package-owned configuration]\n\
    \  Viewer --> ComfyUI[Required ComfyUI connection]\n  Viewer -. optional .-> Conduit[Conduit\
    \ workflow integration]\n  Viewer -. optional .-> Hooks[Host integration hooks]"
  description: The installable core owns viewing and configuration, while Conduit
    and host hooks remain explicit integration points.
  id: blk_viewer_standalone
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Keep integrations behind explicit boundaries


    The gallery, focused viewer, file watching, thumbnails, search, and quicksave
    run through the core package. Conduit adds workflow browsing, run controls, and
    richer output metadata, while namespaced lifecycle hooks provide a separate extension
    point.


    I replaced the dedicated subscriber with structured events and lifecycle hooks,
    added CLI introspection, packaged the browser client, and rejected file paths
    outside configured roots. Integrations can extend the viewer without becoming
    part of its startup contract.'
  id: blk_viewer_integration_boundaries
  type: text
