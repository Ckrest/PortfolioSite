content:
  blocks:
  - body: '## Repair the event handoff


      ComfyUI Conduit was still saving completed outputs, but Comfy Viewer was not
      receiving the event that refreshes its gallery. I traced the break to the local
      Constellation Framework adapter: its import path still pointed at the former
      location of the event package.


      I corrected the adapter to load the event publisher from its managed location
      and verified the complete route from saved output through Redis to the gallery.
      The adapter remains outside Conduit’s package boundary, keeping the host integration
      optional while the public package stays self-contained.'
    id: blk_editorial_fix-comfyui-conduit-redi
    type: text
  - caption: The repaired adapter carries an artifact event to Comfy Viewer while
      output saving remains part of Conduit’s core path.
    code: "flowchart LR\n  Output[Completed Conduit output] --> Saved[Saved output]\n\
      \  Output --> Adapter[Optional Constellation adapter]\n  Adapter --> Redis[Redis\
      \ artifact event]\n  Redis --> Viewer[Comfy Viewer refresh]"
    id: blk_conduit_event_fix
    presentation: content
    sourceMode: inline
    summary: The repaired adapter carries an artifact event to Comfy Viewer while
      output saving remains part of Conduit’s core path.
    type: mermaid
