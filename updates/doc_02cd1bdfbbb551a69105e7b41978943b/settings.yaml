blocks:
- body: '## Plan from software to physical systems


    I wrote the proposal to turn a broad interest in applied AI into a concrete engineering
    program with three connected phases:


    1. **AI & Software** — research practical uses, build local prototypes, and establish
    evaluation methods.

    2. **Robotics & Hardware** — apply that foundation to sensors, control, and physical
    engineering constraints.

    3. **Integration & Final Project** — combine the disciplines in a working system
    and document the result.'
  id: blk_ai_proposal_story
