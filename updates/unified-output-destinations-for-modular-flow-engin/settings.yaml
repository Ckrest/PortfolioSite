content:
  blocks:
  - body: '## Expose the engine as a service


      Modular Flow Engine now exposes the same JSON flows through a FastAPI service.
      Clients can list available flows, inspect their inputs and components, validate
      a request, execute a flow, and check service health without importing engine
      internals or spawning the CLI themselves.


      The CLI and HTTP service use the same execution engine, so a flow remains one
      portable document rather than gaining a separate server-specific format.'
    id: blk_editorial_unified-output-destinati
    type: text
  - caption: The flow’s sink configuration determines both result delivery and the
      service’s default wait behavior.
    code: "flowchart TD\n  Request[HTTP execute request] --> Check{Return destination?}\n\
      \  Check -->|Yes| Wait[Wait for result]\n  Check -->|No| Accept[Accept background\
      \ run]\n  Wait --> Engine[Shared flow engine]\n  Accept --> Engine\n  Engine\
      \ --> Sink{Declared sink destinations}\n  Sink --> Return[API response]\n  Sink\
      \ --> File[JSON file]\n  Sink --> Console[Console output]"
    id: blk_flow_engine_http_delivery
    presentation: content
    sourceMode: inline
    summary: The flow’s sink configuration determines both result delivery and the
      service’s default wait behavior.
    type: mermaid
  - body: '## Let sinks define where results go


      Each collector or JSON writer names one or more destinations for its finalized
      value. `return` adds data to the HTTP response, `file` writes JSON beneath the
      run’s output directory, and `console` prints it for command-line use. The execution
      context owns these writers, so sinks share one delivery contract and nested
      flow scopes can contribute to one response.


      The service inspects those declarations before execution. A flow with a `return`
      destination waits and sends the collected value back; a file- or console-only
      flow is accepted for background execution. Callers can override the default
      wait behavior explicitly.'
    id: blk_flow_engine_sink_delivery
    type: text
  - caption: One sink can return its completed value to the caller and write the same
      result to a file.
    code: "{\n  \"type\": \"sink/collector\",\n  \"config\": {\n    \"destinations\"\
      : [\"return\", \"file\"],\n    \"path\": \"results.json\"\n  }\n}"
    filename: sink-config.json
    id: blk_output_destinations
    language: json
    presentation: content
    sourceMode: inline
    type: code
