blocks:
- body: '## Stage evidence before attachment


    Work Report now gathers discovered evidence in a PostgreSQL staging pool instead
    of attaching every nearby file immediately. Each candidate enters as pending with
    its source path, artifact type, metadata, and an optional link to the shared artifact
    record.


    Files can also be added directly, so discovered and explicitly supplied material
    move through the same curation flow.'
  id: blk_editorial_artifact-curation-stagin
  type: text
- code: "flowchart LR\n  Source[Discover or add] --> Pending[Pending]\n  Pending -.->\
    \ Score[Optional score]\n  Pending --> Curate{Curate}\n  Score -.-> Curate\n \
    \ Curate -->|Approve| Store[Store in report]\n  Curate -->|Reject| Exclude[Exclude]\n\
    \  Store --> Complete[Complete]"
  description: Candidates remain separate from the report until curation selects the
    approved set for durable storage.
  id: blk_artifact_staging
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Curate the candidate set


    Staged artifacts can be captioned and approved or rejected by item, filename pattern,
    or as a group. An optional local model can add a relevance score and short explanation,
    and threshold commands can apply those scores across pending items.


    Finalizing an approved set copies that material into the report’s durable storage,
    writes the artifact list, completes the report, and clears the staging pool.'
  id: blk_curate_candidate_set
  type: text
date: '2026-01-29'
