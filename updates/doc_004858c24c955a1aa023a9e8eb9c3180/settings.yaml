- body: '## Edit the layout in place


    Edit mode turned the rendered overlay itself into the design surface. Selecting
    an element revealed an outline and corner handles; dragging moved it, the handles
    resized it, and snapping aligned it with screen or neighboring element edges.


    Each interaction updated the active element and visible widget together. Leaving
    edit mode removed the selection chrome and restored click-through behavior.'
  id: blk_hud_editing
  type: text
- description: Edit mode exposed the selected element’s outline and resize handles
    directly on the rendered overlay.
  id: blk_hud_edit_mode_capture
  presentation: intrinsic
  src: media/desktop-hud-edit-mode.png
  type: image
- body: '## Control the same model at runtime


    A local HTTP API exposed explicit operations to list, add, update, and remove
    elements; reload configuration; toggle edit mode; check health; and manage profiles.
    It dispatched GTK mutations onto the application thread with a bounded wait, giving
    launchers and automation structured operations instead of arbitrary code execution.


    Profile operations saved, restored, switched, and combined named arrangements
    through the same runtime surface.'
  id: blk_hud_runtime_control
  type: text
- code: "flowchart LR\n  Profiles[Layout profiles] --> Model[Live element model]\n\
    \  API[Local HTTP API] --> Model\n  Editor[Drag resize snap] --> Model\n  Model\
    \ --> Image[Image elements]\n  Model --> Video[Looping video]\n  Model --> Graph[Graph\
    \ Library widgets]\n  Image --> Surface[GTK4 layer-shell surface]\n  Video -->\
    \ Surface\n  Graph --> Surface"
  description: Profiles, runtime commands, and direct manipulation converged on the
    element model rendered on the layer-shell surface.
  id: blk_hud_architecture
  presentation: content
