- body: '## Edit the layout in place


    Edit mode turns the rendered overlay itself into the design surface. Selecting
    an element reveals an outline and corner handles; dragging moves it, the handles
    resize it, and snapping aligns it with screen or neighboring element edges.


    Each interaction updates the active element and visible widget together. Leaving
    edit mode removes the selection chrome and restores click-through behavior.'
  id: blk_hud_editing
  type: text
- description: Edit mode exposes the selected element’s outline and resize handles
    directly on the rendered overlay.
  id: blk_hud_edit_mode_capture
  kind: image
  presentation: intrinsic
  src: media/desktop-hud-edit-mode.png
  type: image
- body: '## Control the same model at runtime


    A local HTTP API exposes explicit operations to list, add, update, and remove
    elements; reload configuration; toggle edit mode; check health; and manage profiles.
    It dispatches GTK mutations onto the application thread with a bounded wait, giving
    launchers and automation structured operations instead of arbitrary code execution.


    Profile operations save, restore, switch, and combine named arrangements through
    the same runtime surface.'
  id: blk_hud_runtime_control
  type: text
- code: "flowchart LR\n  Profiles[Layout profiles] --> Model[Live element model]\n\
    \  API[Local HTTP API] --> Model\n  Editor[Drag resize snap] --> Model\n  Model\
    \ --> Image[Image elements]\n  Model --> Video[Looping video]\n  Model --> Graph[Graph\
    \ Library widgets]\n  Image --> Surface[GTK4 layer-shell surface]\n  Video -->\
    \ Surface\n  Graph --> Surface"
  description: Profiles, runtime commands, and direct manipulation converge on the
    element model rendered on the layer-shell surface.
  id: blk_hud_architecture
  presentation: content
  sourceMode: inline
  type: mermaid
