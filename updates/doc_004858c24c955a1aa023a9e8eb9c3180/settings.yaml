blocks:
- body: '## Assemble the desktop from elements


    I built Desktop HUD as a transparent GTK4 layer-shell surface that placed images,
    looping video, and live Graph Library widgets directly on the Wayland desktop.
    Each element shared identity, position, size, opacity, and visibility fields while
    its renderer handled type-specific behavior.


    Outside edit mode, the overlay cleared its input region, keeping the desktop click-through.
    Image and video playback remained inside their own elements while the HUD coordinated
    composition, lifecycle, and placement.'
  id: blk_editorial_desktop-hud-gtk4-layer-s
  type: text
- description: 'Two different looping fire versions: an opaque treatment and an alpha-transparent
    version that kept the desktop visible through the flames.'
  id: c9f531e0-b378-4797-b53c-f69e04ee5f5a
  presentation: intrinsic
  src: media/screenshot_2026-03-01_19-08-52.png
  type: image
- body: '## Bring live data into the overlay


    Graph Library supplied gauges and line charts as embeddable GTK widgets. Desktop
    HUD selected a renderer and provider, scheduled refreshes, and placed the result
    beside image and video elements without absorbing Graph Library’s data history
    or drawing logic.


    By changing only the provider and renderer configuration, the same element model
    hosted command-backed gauges, rolling line charts, and static demonstration data.'
  id: blk_hud_live_data
  type: text
- id: 05929c6d-7b52-4c4b-9f19-0f5ede5cf23c
