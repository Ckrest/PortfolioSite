blocks:
- body: '## Assemble the desktop from elements


    I built Desktop HUD as a transparent GTK4 layer-shell surface that places images,
    looping video, and live Graph Library widgets directly on the Wayland desktop.
    Each element shares identity, position, size, opacity, and visibility fields while
    its renderer handles type-specific behavior.


    Outside edit mode, the overlay clears its input region, keeping the desktop click-through.
    Image and video playback remain inside their own elements while the HUD coordinates
    composition, lifecycle, and placement.'
  id: blk_editorial_desktop-hud-gtk4-layer-s
  type: text
- description: 'Two different looping fire versions: an opaque treatment and an alpha-transparent
    version that keeps the desktop visible through the flames.'
  id: c9f531e0-b378-4797-b53c-f69e04ee5f5a
  kind: image
  presentation: intrinsic
  src: media/screenshot_2026-03-01_19-08-52.png
  type: image
- body: '## Bring live data into the overlay


    Graph Library supplies gauges and line charts as embeddable GTK widgets. Desktop
    HUD selects a renderer and provider, schedules refreshes, and places the result
    beside image and video elements without absorbing Graph Library’s data history
    or drawing logic.


    By changing only the provider and renderer configuration, the same element model
    hosts command-backed gauges, rolling line charts, and static demonstration data.'
  id: blk_hud_live_data
  type: text
- id: 05929c6d-7b52-4c4b-9f19-0f5ede5cf23c
  label: Graph Library
  type: related-mini
  updateId: doc_aa793128a2075e32a8dea215c096de7c
