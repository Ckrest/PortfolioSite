blocks:
- body: '## Add another capture source


    Work Report’s screenshot collection accepts phone captures alongside desktop screenshots.
    Both enter the same artifact discovery and review flow, avoiding a separate reporting
    path for each source.'
  id: blk_editorial_add-phone-screenshot-sup
  type: text
- code: "flowchart LR\n  Desktop[Desktop screenshots] --> Collection[Shared screenshot\
    \ collection]\n  Phone[Phone screenshots] --> Collection\n  Collection --> Discovery[Work\
    \ Report discovery]\n  Discovery --> Review[Evidence review]"
  description: Desktop and phone screenshots enter the same Work Report collection,
    discovery, and evidence-review flow. Multiple screenshot sources converge on one
    Work Report collection and review path.
  id: blk_phone_capture_flow
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Preserve where evidence came from


    Phone captures retain a distinct `phone-screenshot` type and `Phone screenshot:`
    label during collection. Their origin stays visible during review without changing
    how the underlying image is copied or handled.'
  id: blk_phone_source_identity
  type: text
