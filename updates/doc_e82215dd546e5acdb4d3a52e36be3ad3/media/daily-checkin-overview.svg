<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Daily Check-In mobile form and portable JSON record</title>
  <desc id="desc">A split composition showing a narrow Android daily check-in form on the left and the matching human-readable JSON document with local storage on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0e18"/><stop offset=".55" stop-color="#15162a"/><stop offset="1" stop-color="#22183c"/></linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141524"/><stop offset="1" stop-color="#0b0c15"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#6657df"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#05050d" flood-opacity=".58"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="58"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1 11 6 1 11Z" fill="#8b7cff"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.muted{fill:#9b9db7}.label{fill:#b7b9cf;font-size:16px;font-weight:700;letter-spacing:2px}.rating{fill:#aeb0c6;font-size:21px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.code{font-size:21px}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="110" r="250" fill="#6c5ce7" opacity=".16" filter="url(#soft)"/>
  <circle cx="170" cy="780" r="210" fill="#4436b4" opacity=".15" filter="url(#soft)"/>
  <path d="M755 0V900" stroke="#fff" stroke-opacity=".06" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="132" y="44" width="494" height="812" rx="56" fill="#080910" stroke="#35364f" stroke-width="3"/>
    <rect x="153" y="66" width="452" height="768" rx="40" fill="url(#phone)"/>
  </g>
  <rect x="310" y="58" width="138" height="13" rx="7" fill="#2d2e43"/>

  <g class="sans">
    <text x="184" y="132" fill="#8b7cff" font-size="34" font-weight="800">‹</text>
    <text x="379" y="129" fill="#f4f4fb" font-size="27" font-weight="760" text-anchor="middle">TODAY</text>
    <text x="574" y="132" fill="#8b7cff" font-size="34" font-weight="800" text-anchor="end">›</text>
    <text x="188" y="186" class="label">SLEEP QUALITY</text>
    <text x="188" y="318" class="label">ALERTNESS</text>
    <text x="188" y="450" class="label">MOOD</text>

    <g>
      <circle cx="197" cy="236" r="31" fill="#24263f" stroke="#333652"/><circle cx="287" cy="236" r="31" fill="#24263f" stroke="#333652"/><circle cx="377" cy="236" r="31" fill="#24263f" stroke="#333652"/><circle cx="467" cy="236" r="31" fill="url(#accent)"/><circle cx="557" cy="236" r="31" fill="#24263f" stroke="#333652"/>
      <text x="197" y="237" class="rating">1</text><text x="287" y="237" class="rating">2</text><text x="377" y="237" class="rating">3</text><text x="467" y="237" class="rating" fill="#fff">4</text><text x="557" y="237" class="rating">5</text>
    </g>
    <g>
      <circle cx="197" cy="368" r="31" fill="#24263f" stroke="#333652"/><circle cx="287" cy="368" r="31" fill="#24263f" stroke="#333652"/><circle cx="377" cy="368" r="31" fill="url(#accent)"/><circle cx="467" cy="368" r="31" fill="#24263f" stroke="#333652"/><circle cx="557" cy="368" r="31" fill="#24263f" stroke="#333652"/>
      <text x="197" y="369" class="rating">1</text><text x="287" y="369" class="rating">2</text><text x="377" y="369" class="rating" fill="#fff">3</text><text x="467" y="369" class="rating">4</text><text x="557" y="369" class="rating">5</text>
    </g>
    <g>
      <circle cx="197" cy="500" r="31" fill="#24263f" stroke="#333652"/><circle cx="287" cy="500" r="31" fill="#24263f" stroke="#333652"/><circle cx="377" cy="500" r="31" fill="#24263f" stroke="#333652"/><circle cx="467" cy="500" r="31" fill="url(#accent)"/><circle cx="557" cy="500" r="31" fill="#24263f" stroke="#333652"/>
      <text x="197" y="501" class="rating">1</text><text x="287" y="501" class="rating">2</text><text x="377" y="501" class="rating">3</text><text x="467" y="501" class="rating" fill="#fff">4</text><text x="557" y="501" class="rating">5</text>
    </g>

    <text x="188" y="574" class="label">OPTIONAL NOTES</text>
    <rect x="188" y="596" width="382" height="92" rx="20" fill="#1b1d32" stroke="#333652" stroke-width="2"/>
    <text x="214" y="650" fill="#777a96" font-size="20">Add a short note…</text>
    <text x="188" y="746" class="label">SLEEP WINDOW</text>
    <text x="188" y="792" fill="#f2f2fb" font-size="20" font-weight="700">00:30</text>
    <text x="570" y="792" fill="#f2f2fb" font-size="20" font-weight="700" text-anchor="end">08:45</text>
    <line x1="262" y1="784" x2="496" y2="784" stroke="#30334d" stroke-width="12" stroke-linecap="round"/>
    <line x1="298" y1="784" x2="458" y2="784" stroke="#7969ee" stroke-width="12" stroke-linecap="round"/>
    <circle cx="298" cy="784" r="16" fill="#f1efff" stroke="#7969ee" stroke-width="7"/><circle cx="458" cy="784" r="16" fill="#f1efff" stroke="#7969ee" stroke-width="7"/>
  </g>

  <path d="M654 450C710 450 744 450 790 450" fill="none" stroke="#8b7cff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="730" cy="450" r="8" fill="#8b7cff"/>

  <g class="sans">
    <text x="840" y="120" fill="#a89cff" font-size="19" font-weight="800" letter-spacing="3">PORTABLE DAILY RECORD</text>
    <text x="840" y="169" fill="#f6f5ff" font-size="41" font-weight="780">One entry in the app.</text><text x="840" y="215" fill="#f6f5ff" font-size="41" font-weight="780">One readable document.</text>
    <text x="840" y="255" class="muted" font-size="21">Local storage stays understandable outside the interface.</text>
  </g>

  <g filter="url(#shadow)"><rect x="814" y="300" width="700" height="420" rx="28" fill="#111321" stroke="#343650" stroke-width="2"/><rect x="814" y="300" width="700" height="64" rx="28" fill="#1b1d31"/><rect x="814" y="338" width="700" height="26" fill="#1b1d31"/></g>
  <g class="sans"><rect x="847" y="321" width="24" height="28" rx="4" fill="#8b7cff"/><path d="M865 321v8h7" fill="none" stroke="#ddd9ff" stroke-width="2"/><text x="887" y="343" fill="#e9e8f4" font-size="20" font-weight="700">daily-checkin.json</text><rect x="1321" y="319" width="159" height="32" rx="16" fill="#292b43"/><text x="1400" y="341" fill="#bcbdd0" font-size="14" font-weight="750" text-anchor="middle" letter-spacing="1.5">VERSIONED FILE</text></g>
  <g class="mono code"><text x="856" y="405" fill="#8c8fa8">{</text><text x="884" y="443" fill="#c5baff">"version"</text><text x="1000" y="443" fill="#8c8fa8">:</text><text x="1022" y="443" fill="#f1c985">1,</text><text x="884" y="481" fill="#c5baff">"entries"</text><text x="1000" y="481" fill="#8c8fa8">: {</text><text x="912" y="519" fill="#9ad7c7">"2026-01-01"</text><text x="1095" y="519" fill="#8c8fa8">: {</text><text x="940" y="557" fill="#c5baff">"sleep_quality"</text><text x="1138" y="557" fill="#8c8fa8">:</text><text x="1160" y="557" fill="#f1c985">4,</text><text x="940" y="595" fill="#c5baff">"alertness"</text><text x="1088" y="595" fill="#8c8fa8">:</text><text x="1110" y="595" fill="#f1c985">3,</text><text x="940" y="633" fill="#c5baff">"mood"</text><text x="1035" y="633" fill="#8c8fa8">:</text><text x="1057" y="633" fill="#f1c985">4</text><text x="912" y="671" fill="#8c8fa8">}</text><text x="884" y="700" fill="#8c8fa8">}</text></g>
  <g class="sans">
    <rect x="814" y="752" width="333" height="88" rx="22" fill="#181a2b" stroke="#31334b"/><circle cx="857" cy="796" r="20" fill="#2a2c46"/><path d="M850 796h14M857 789v14" stroke="#a99eff" stroke-width="3" stroke-linecap="round"/><text x="891" y="790" fill="#f0eff8" font-size="18" font-weight="750">USER-CHOSEN FILE</text><text x="891" y="817" fill="#9295ae" font-size="16">Inspectable and portable</text>
    <rect x="1181" y="752" width="333" height="88" rx="22" fill="#181a2b" stroke="#31334b"/><circle cx="1224" cy="796" r="20" fill="#2a2c46"/><path d="M1215 798c4 5 14 5 18 0M1217 791c3-4 11-4 14 0" fill="none" stroke="#a99eff" stroke-width="3" stroke-linecap="round"/><text x="1258" y="790" fill="#f0eff8" font-size="18" font-weight="750">LOCAL BACKUP</text><text x="1258" y="817" fill="#9295ae" font-size="16">Recovery stays on device</text>
  </g>
</svg>
