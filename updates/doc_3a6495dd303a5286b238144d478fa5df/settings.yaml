blocks:
- body: '## Own the wallpaper process


    I built one long-running daemon to own the wallpaper renderer instead of making
    desktop controls manage `swaybg` and `mpvpaper` directly. The daemon reads the
    requested video, image, or solid color from a JSON configuration and resolves
    the active Wayland output from the desktop session.'
  id: blk_editorial_wallpaper-service
  type: text
- description: Desktop Appearance shows the active video wallpaper with its mode selector,
    generic media filename, browse action, and looping control.
  id: blk_wallpaper_controls
  kind: image
  presentation: intrinsic
  src: media/wallpaper-controls-sanitized.png
  type: image
- body: '## Keep the last working background


    On a reload, the daemon starts the replacement renderer, waits briefly for it
    to initialize, and checks that it is still running before terminating the previous
    process. If the replacement fails, the current wallpaper remains in place. The
    same signal-driven loop notices renderer exits and restarts them with backoff
    instead of continuously polling.'
  id: blk_editorial_wallpaper-handoff
  type: text
- code: "flowchart LR\n  Config[Video, image, or color config] --> Service[Wallpaper\
    \ daemon]\n  Output[Detected Wayland output] --> Service\n  Service --> Replacement[Start\
    \ replacement renderer]\n  Replacement --> Check[Check process is still running]\n\
    \  Check --> Handoff[Stop previous renderer]\n  Handoff --> Active[Replacement\
    \ remains active]"
  description: The daemon starts the requested renderer and checks its process before
    releasing the previous background.
  id: blk_wallpaper_original_flow
  presentation: content
  sourceMode: inline
  type: mermaid
date: '2025-12-22'
external_url: https://github.com/Ckrest/wallpaper-service
