blocks:
- body: '## Pin windows at the scene boundary


    I built Topmost Scene to keep selected Wayfire views above ordinary windows, drag
    overlays, and compositor effects. Configuration matches app IDs and namespaces
    automatically, while IPC pins a specific view on demand.


    Each pinned view carries a numeric priority. Reapplying the layer sorts those
    values before it moves the existing scene nodes to the front of Wayfire’s root
    scene, so the order comes from explicit data rather than focus timing or caller
    order.'
  id: blk_editorial_wayfire-topmost-scene-an
  type: text
- code: "flowchart TD\n  View[Wayfire view] --> Match{Configured namespace or IPC\
    \ pin?}\n  Match -->|Yes| Preserve[Preserve original parent]\n  Preserve --> Topmost[Move\
    \ to topmost scene]\n  Priority[Configured priority] --> Topmost\n  Topmost -->\
    \ Restore[Restore on unpin or shutdown]"
  description: Pinning remains reversible because the plugin retains each view’s original
    scene parent.
  id: blk_topmost_scene
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Return views without recreating them


    Before moving a view into the root scene, the plugin saves its original scene
    parent. When no pin rule remains, unpinning reattaches the existing node to that
    parent. Disabling or unloading the plugin restores all tracked views, while view
    destruction removes their bookkeeping.


    Moving and restoring the same node preserves the compositor object, input routing,
    and application lifecycle instead of creating a second representation of the window.'
  id: blk_topmost_restoration
  type: text
- body: '## Control the layer at runtime


    Topmost Scene exposes `pin`, `unpin`, `list`, and `reapply` through IPC, while
    namespace and priority settings supply persistent rules. A smaller Layer Stacker
    companion handles compatibility cases inside an existing layer, re-raising matched
    views after mapping, focus requests, or geometry changes.'
  id: blk_topmost_runtime
  type: text
