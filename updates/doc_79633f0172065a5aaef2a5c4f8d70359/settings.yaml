blocks:
- body: '## Draw and automate the same diagram


    I built Diagram Tool so a diagram can be edited directly in the browser and manipulated
    by an agent without creating separate visual and machine-readable copies. The
    editor provides an infinite canvas, multiple node shapes, labeled connections,
    nested zones, property editing, multi-selection, and undo and redo.'
  id: blk_editorial_diagram-tool
  type: text
- body: '## Keep one shared runtime


    A local FastAPI service owns the active diagram. The browser and MCP tools both
    call its HTTP API, while WebSocket notifications refresh the open editor whenever
    either side changes the model. An agent can add or move a node, create an edge,
    or save the diagram, and the browser immediately reflects the same state.


    Each diagram remains ordinary JSON with stable identifiers for the diagram, nodes,
    and edges. Node records preserve position, dimensions, shape, color, tags, and
    descriptions; edges retain their endpoints and labels. Snapshot history supplies
    undo and redo without introducing a second representation.'
  id: 1106f715-09b5-4217-986d-c2990eeb6e21
  type: text
- body: '## Keep the result local and inspectable


    The backend binds to loopback and does not require a hosted account. Diagrams
    can be opened from or saved to an explicitly chosen path, leaving each document
    available for inspection, copying, or version control outside the editor.'
  id: a8f94cfb-4b6f-4426-bb99-05cdf8fd4193
  type: text
