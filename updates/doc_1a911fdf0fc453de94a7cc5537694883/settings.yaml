blocks:
- body: '## Keep capture ready between hotkeys


    I replaced per-hotkey startup with a background service that stays ready between
    captures. The `screenshot` command sends it interactive, fullscreen, region, or
    window requests, while one clear lifecycle prevents captures from competing with
    each other.


    Pressing the hotkey again during an interactive capture reuses the same frozen
    screen and saves it fullscreen instead of opening another selector. The same shortcut
    therefore supports both deliberate selection and quick fullscreen capture: press
    once to choose a target, or press again to save the frozen screen.'
  id: blk_screenshot_service_story
  type: text
- body: '## Keep selection fast and direct


    Instead of turning the first capture into a finished image and reopening it, the
    service keeps the captured pixels available while a region or window is selected.
    Only the chosen result is converted into an image and passed to the usual save,
    clipboard, notification, and automation options.


    This keeps the interaction focused on the selection itself: the frozen screen
    appears quickly, remains stable beneath the pointer, and reaches its destination
    without an extra image conversion.'
  id: blk_screenshot_service_raw_frame
  type: text
- code: "sequenceDiagram\n  participant C as CLI or hotkey\n  participant S as Persistent\
    \ GTK service\n  participant W as Wayland capture boundary\n  participant O as\
    \ Request-scoped selector\n  C->>S: Explicit capture request\n  S->>W: Capture\
    \ cursor-free desktop\n  W-->>S: Frozen raw frame and output layout\n  S->>S:\
    \ Join window geometry by opaque identity\n  S->>O: Create selector for this request\n\
    \  O-->>S: Region, fullscreen, or exact window\n  alt Region or fullscreen\n \
    \   S->>S: Crop or reuse the frozen frame\n  else Exact window\n    S->>W: Capture\
    \ selected opaque identity\n    W-->>S: Exact window frame\n  end\n  S->>S: Apply\
    \ shared output policy\n  S-->>C: File and structured output result"
  description: The service persists across requests; the frozen selector exists only
    for the active request, and exact window capture remains distinct from region
    cropping.
  id: blk_screenshot_service_flow
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Refine the frozen selector


    I matched Wayfire''s window geometry to the capture backend through opaque foreign-toplevel
    identities, keeping same-titled windows distinct. Window capture proceeds only
    when both sides identify the same target.


    The existing dimensions, crosshair, and one-pixel keyboard control remain in place.
    I expanded the magnifier into a 480-pixel circular view at 8× zoom and made the
    instruction label dismiss as the pointer approaches it.'
  id: blk_screenshot_service_selector
  type: text
