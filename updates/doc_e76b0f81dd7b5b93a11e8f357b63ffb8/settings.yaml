blocks:
- body: '## Give tool activity a shared data model


    I built a PostgreSQL history store so Constellation tools can record operations
    and the files they consume or produce without inventing a separate log format
    for every integration. The schema gives operations, artifacts, and tags independent
    records, while relation tables preserve inputs, outputs, categories, and parent-operation
    chains.'
  id: blk_editorial_postgresql-history-database
  type: text
- body: '## Preserve lineage through the operation lifecycle


    The repository API lets callers start an operation, register inputs as they become
    known, attach outputs, and finish with success or failure. A convenience path
    covers work that has already completed. Artifact registration is idempotent by
    resolved path, allowing later queries to follow an artifact back to the operation
    that consumed or produced it.'
  id: blk_history_lineage_workflow
  type: text
- code: "erDiagram\n  OPERATION ||--o{ OPERATION_INPUT : consumes\n  ARTIFACT ||--o{\
    \ OPERATION_INPUT : is_input\n  OPERATION ||--o{ OPERATION_OUTPUT : produces\n\
    \  ARTIFACT ||--o{ OPERATION_OUTPUT : is_output\n  OPERATION }o--o{ TAG : categorized_by\n\
    \  OPERATION o|--o{ OPERATION : parent_of\n\n  OPERATION {\n    uuid id\n    string\
    \ operation_type\n    string tool_name\n    string status\n    timestamp started_at\n\
    \    timestamp completed_at\n    jsonb config\n  }\n  ARTIFACT {\n    uuid id\n\
    \    text file_path\n    string file_type\n    string checksum\n    jsonb metadata\n\
    \  }"
  description: The schema models operations and artifacts independently, then uses
    explicit relations for inputs, outputs, tags, and operation chains.
  id: blk_history_database
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Keep the storage boundary inspectable


    SQLAlchemy provides the model and repository API, while Alembic manages schema
    changes. Queries cover recent activity, time ranges, tools, operation types, tags,
    artifact history, and parent chains. Local peer authentication, direct SQL access,
    and documented dump and restore procedures keep the history usable outside the
    Python interface.'
  id: blk_history_storage_boundary
  type: text
