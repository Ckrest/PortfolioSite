blocks:
- body: '## Turn the output folder into a review library


    ComfyUI produces files effectively, but its output folder stops being useful once
    iterations accumulate. Comfy Viewer now indexes those files into a browser-based
    library, generates cached WebP thumbnails, and extracts searchable metadata through
    hooks.


    A file watcher feeds new results into the library while WebSocket events refresh
    the open page. Search and metadata filters narrow the collection without requiring
    the underlying files to be reorganized.'
  id: blk_editorial_comfy-viewer
  type: text
- description: Comfy Viewer library with workflow controls beside a grid of varied
    generated images. Cached previews and metadata filters turn a growing output folder
    into a browsable visual library.
  id: blk_comfy_library
  presentation: intrinsic
  src: media/screenshot_2026-03-01_20-55-50-1.png
  type: image
- body: '## Keep decisions beside the image


    Opening a result switches to a focused view with nearby-image navigation and keyboard
    shortcuts. A result can be copied into a separate quicksave collection, flagged,
    liked, or disliked without moving or rewriting the original ComfyUI output.


    The same index preserves those review decisions and extracted metadata, making
    it possible to revisit a generation run without manually curating its folders
    first.'
  id: blk_comfy_review
  type: text
- description: Comfy Viewer focused-image view with save, flag, rating, and navigation
    controls. The focused viewer keeps navigation and review actions beside the generated
    image.
  id: blk_comfy_focus
  presentation: intrinsic
  src: media/screenshot_2026-03-01_20-56-58.png
  type: image
- body: '## Make workflow control optional


    The gallery and focused viewer work on their own. When the workflow gateway is
    available, the library loads configured workflows and their input schemas, remembers
    the last selection and saved overrides, and submits new runs from the sidebar.


    Workflow controls retain their own availability and visibility states, so losing
    the runner does not remove access to existing images.'
  id: blk_comfy_workflows
  type: text
- description: Comfy Viewer settings panel with empty connection and folder fields.
    Display behavior, optional workflow controls, and watched folders remain independently
    configurable.
  id: blk_comfy_settings
  presentation: intrinsic
  src: media/comfy-viewer-settings-redacted.png
  type: image
- code: "flowchart LR\n  Output[ComfyUI output folder] --> Watch[Watch for images]\n\
    \  Watch --> Index[Extract and index metadata]\n  Index --> Cache[Cache WebP thumbnails]\n\
    \  Cache --> Library[Searchable library]\n  Library --> Viewer[Focused viewer]\n\
    \  Viewer --> Review[Quicksave, flag and rate]\n  Library -. run requests .->\
    \ Gateway[Optional workflow gateway]\n  Gateway -. completion events .-> Index"
  description: Image browsing remains a complete path of its own, with workflow execution
    connected as an optional integration.
  id: blk_comfy_viewer_context
  presentation: content
  sourceMode: inline
  type: mermaid
