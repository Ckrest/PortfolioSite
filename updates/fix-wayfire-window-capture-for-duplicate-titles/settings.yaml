content:
  blocks:
  - body: '## Give every window a stable capture identity


      Several windows can legitimately share a title and application ID. The capture
      path now carries the underlying Wayfire view on each foreign-toplevel handle,
      giving every request an exact window identity.


      That direct handle-to-view link keeps each window attached to its own capture
      source and preview. Titles and application IDs remain useful display metadata,
      while compositor identity selects the frames.'
    id: blk_editorial_fix-wayfire-window-captu
    type: text
  - caption: Each handle keeps a direct path to one Wayfire view and one capture source.
    code: "flowchart TD\n  Shared[Shared title and app ID]\n  Shared -. display metadata\
      \ .-> HandleA[Toplevel handle A]\n  Shared -. display metadata .-> HandleB[Toplevel\
      \ handle B]\n  HandleA --> ViewA[Wayfire view A]\n  HandleB --> ViewB[Wayfire\
      \ view B]\n  ViewA --> CaptureA[Capture source A]\n  ViewB --> CaptureB[Capture\
      \ source B]"
    id: blk_duplicate_titles
    presentation: content
    sourceMode: inline
    summary: Each handle keeps a direct path to one Wayfire view and one capture source.
    type: mermaid
