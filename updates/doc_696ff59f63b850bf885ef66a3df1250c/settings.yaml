blocks:
- body: '## Save a preview without changing the graph


    I added QuickSave as a toolbar action for keeping an image already visible in
    ComfyUI without adding a Save Image node to the workflow. It collects distinct
    images from workflow nodes and the latest execution, saves the only result immediately,
    or opens a picker when several are available.'
  id: blk_quicksave_story
  type: text
- body: '## Avoid overwrites at the save boundary


    I added a small `/quicksave` route behind the toolbar action. The extension fetches
    the chosen preview and sends its encoded image data, original filename, and configured
    save path to that route. The backend sanitizes the filename, falls back to `output/quicksave`
    when no valid custom directory is set, skips byte-for-byte duplicates, and adds
    a numeric suffix to other collisions. A toast reports the result in ComfyUI.'
  id: blk_quicksave-save-boundary
  type: text
- code: "flowchart TD\n  Action[Choose QuickSave] --> Find[Collect visible previews]\n\
    \  Find --> Choice{One image?}\n  Choice -- Yes --> Save[Send selected image]\n\
    \  Choice -- No --> Picker[Choose from picker]\n  Picker --> Save\n  Save -->\
    \ Safe[Sanitize name and path]\n  Safe --> Result[Skip duplicate or write safe\
    \ file]\n  Result --> Toast[Show result]"
  description: QuickSave chooses an existing preview, applies safe file handling,
    and returns visible feedback without changing the workflow graph.
  id: blk_quicksave_flow
  presentation: content
  sourceMode: inline
  type: mermaid
date: '2025-12-19'
