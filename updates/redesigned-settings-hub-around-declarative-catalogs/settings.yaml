content:
  blocks:
  - body: '## Move package settings into validated tile sets


      Settings Hub now loads versioned YAML catalogs instead of requiring every integration
      to construct its own GTK page. Core definitions establish the shared tabs; each
      package contributes one or more tile sets, assigns them through `tab_id`, and
      declares the controls that belong there.


      A catalog loader merges built-in and package definitions, validates their structure
      before rendering, and evaluates visibility conditions at the tab, tile-set,
      and tile levels. Packages can add focused settings surfaces without taking over
      navigation or duplicating the application shell.'
    id: blk_settings_catalog_story
    type: text
  - alt: Settings Hub architecture flowing from core tab definitions and package tile-set
      catalogs through loading, validation, visibility planning, shared tile handlers,
      and a GTK page stack
    caption: Core tabs provide navigation, package catalogs contribute validated tile
      sets, and the shared runtime renders them through reusable GTK handlers.
    id: blk_settings_hub_architecture
    presentation: intrinsic
    src: media/catalog-runtime.svg
    type: image
  - body: '## Render controls through a shared vocabulary


      One renderer now handles headers, text and information panels, images, buttons,
      toggles, selects, text and numeric inputs, lists, time, font, file and color
      pickers, graphs, gauges, separators, switchable panels, and reorderable lists.


      A tile set can declare a configuration file, then bind ordinary controls through
      section and key properties. Monitoring tiles can read command, file, SQLite,
      or static providers and poll when live values are useful. The package still
      owns the command or configuration surface; Settings Hub owns the consistent
      control and presentation.'
    id: blk_settings_hub_shared_vocabulary
    type: text
  - alt: Settings Hub Tile showcase tab with a dropdown, enabled toggle, numeric stepper,
      color picker, and action button
    caption: The presentation tab renders a select, toggle, numeric input, color picker,
      and action from one catalog-defined tile set.
    id: blk_settings_hub_v2_ui
    presentation: intrinsic
    src: media/settings-hub-v2-showcase.png
    type: image
  - caption: A package assigns its tile set to an existing tab and keeps command-backed
      data inside the tile that consumes it.
    code: "tile_sets:\n  - id: service-health\n    tab_id: services\n    title: Service\
      \ health\n    order: 20\n    visible_when:\n      - command: example-tool\n\
      \    tiles:\n      - id: current-status\n        type: info\n        title:\
      \ Current status\n        props:\n          source:\n            type: command\n\
      \            command: example-tool status\n\n      - id: recent-activity\n \
      \       type: graph\n        title: Recent activity\n        props:\n      \
      \    max_points: 90\n          provider:\n            type: command\n      \
      \      command: example-tool metric\n            poll_interval_ms: 2500"
    filename: extension-catalog.example.txt
    id: blk_settings_hub_catalog
    language: yaml
    presentation: content
    sourceMode: attached
    src: media/extension-catalog.example.txt
    type: code
  - body: '## Keep failures contained


      Structural validation runs before page creation, and visibility checks keep
      unavailable integrations out of the interface. An unknown tile, invalid definition,
      unavailable provider, or failed command stays local to the affected integration
      instead of collapsing the window.


      Pages render lazily into a stable stack and remain cached as navigation changes.
      Tab visibility and order remain adjustable, while provider work runs away from
      the GTK event loop and reports failures through the interface. This gives package-owned
      settings and monitoring views one predictable shell without making Settings
      Hub responsible for each package''s operational logic.'
    id: blk_settings_hub_failure_isolation
    type: text
