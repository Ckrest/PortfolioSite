blocks:
- body: '## Operate background services from one place


    I built Process Manager because the desktop depended on a growing set of systemd
    user services, but checking and controlling them required repeated terminal commands.
    The GTK dashboard discovers opted-in services and provides explicit start, stop,
    restart, enable, and disable actions while systemd retains responsibility for
    process lifetime and restart policy.'
  id: blk_editorial_process-manager
  type: text
- body: '## Keep repeated status checks lightweight


    The grouped service list shows state, port, uptime, and memory use with distinct
    running, failed, stopped, starting, and stopping states. A two-second cache gathers
    each service status once per refresh window instead of repeating several subprocess
    calls every second. Lifecycle actions invalidate the affected entry so the UI
    can reconcile immediately.'
  id: blk_process_status_cache
  type: text
- code: "flowchart LR\n  Discovery[Opt-in service discovery] --> Cache[Two-second\
    \ status cache]\n  Systemd[systemd user manager] --> Cache\n  Cache --> List[Grouped\
    \ service list]\n  List --> Selection[Selected service context]\n  Selection -->\
    \ Actions[Start, stop, restart, enable]\n  Journal[journalctl JSON stream] -->\
    \ Buffer[Bounded parsed log buffer]\n  Buffer --> Filters[Service, level, and\
    \ text filters]\n  Filters --> Selection"
  description: Status, controls, and live logs converge on the same selected systemd
    unit while systemd retains process ownership.
  id: blk_process_workspace
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Make live logs part of the workspace


    One background `journalctl --user -f -o json` stream loads recent entries and
    follows every watched unit. Parsed priority levels feed a bounded buffer through
    a GTK-safe queue. The interface can isolate one service or combine them, filter
    severity, search text, clear the view, and pause auto-scroll while an earlier
    failure is inspected.'
  id: blk_process_live_logs
  type: text
date: '2025-10-18'
