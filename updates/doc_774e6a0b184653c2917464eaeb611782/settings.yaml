blocks:
- body: '## Coordinate the overnight schedule


    I built Night Mode around explicit blue-light, bedtime, and wake times. The service
    handles schedules that cross midnight, starts `wlsunset` with the configured day
    and night temperatures, and keeps the overnight behavior in one place.'
  id: blk_editorial_night-mode
  type: text
- body: '## Keep reminders on the same timeline


    The configuration also holds the blue-light message, bedtime warning offset, and
    bedtime message. Bringing those values together makes the complete display-and-reminder
    sequence easy to read and adjust.'
  id: blk_editorial_night_mode_overrides
  type: text
- code: "flowchart LR\n  Day[Normal display] -->|blue-light start| Warm[Warm display]\n\
    \  Warm --> Warning[Bedtime warning]\n  Warning --> Bedtime[Bedtime reminder]\n\
    \  Bedtime -->|wake time| Day"
  description: The configured overnight window connects display warmth and reminders
    in one sequence.
  id: blk_night_schedule_flow
  presentation: content
  sourceMode: inline
  type: mermaid
- code: '[schedule]

    blue_light_start = "00:00"

    bedtime = "02:00"

    wake_time = "10:00"

    transition_minutes = 5


    [temperature]

    day = 6500

    night = 3000


    [notifications]

    enabled = true

    blue_light_message = "Blue light filter activated - winding down"

    bedtime_message = "Bedtime! Time to wrap up and rest"

    bedtime_warning_minutes = 15'
  description: The configuration keeps the overnight window, target temperatures,
    and notification timing together.
  filename: night-mode-config.toml
  id: blk_night_schedule
  language: toml
  presentation: content
  sourceMode: inline
  type: code
date: '2026-01-02'
