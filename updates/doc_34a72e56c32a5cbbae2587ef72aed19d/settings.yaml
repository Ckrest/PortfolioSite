blocks:
- body: '## Two paths to Mermaid source


    I built two focused ways to create Mermaid diagrams. Mermaid Tool supplied nine
    reusable templates, a guided CLI, syntax checks, and optional model-assisted drafting
    for authoring new diagrams.


    A separate visualizer turned recorded Constellation data into repeatable dependency,
    timeline, and flow views. Both paths produced portable `.mmd` source, so authored
    and generated diagrams could enter the same workflow.'
  id: blk_editorial_mermaid-diagram-support-
  type: text
- description: A project planning timeline rendered from Mermaid source.
  id: blk_mermaid_preview
  presentation: intrinsic
  src: media/mermaid-diagram-2026-02-28-003644.png
  type: image
- body: '## Carry portable source through Work Report


    Work Report learned to discover `.mmd` outputs, copy their text into durable report
    storage, and preserve the source rather than flattening each diagram into an image.


    Portfolio Editor mapped that artifact into a native Mermaid block with editable
    source and a caption. The diagram could move through review as structured evidence
    instead of a detached screenshot.'
  id: blk_mermaid_artifact_path
  type: text
- code: "flowchart LR\n  Author[Templates, wizard, or model-assisted draft] --> Source[Mermaid\
    \ source]\n  Records[Constellation records] --> Views[Generated views]\n  Views\
    \ --> Source\n  Source --> Report[Work Report artifact]\n  Report --> Editor[Portfolio\
    \ Editor block]\n  Editor --> Page[Portfolio page]"
  description: Authored and generated diagrams converged on one portable source and
    artifact path.
  id: blk_mermaid_source
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Render the same block on portfolio pages


    The portfolio renderer turned the Mermaid block into a responsive diagram while
    keeping the source as the underlying artifact. Authored diagrams and generated
    Constellation views reached the page through one block type and one artifact path.


    This kept the visual, its caption, and the source that defined its relationships
    together from report intake through publication.'
  id: blk_mermaid_portfolio_rendering
  type: text
date: '2026-02-22'
