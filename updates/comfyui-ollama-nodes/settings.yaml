content:
  blocks:
  - body: '## Call a local model from the graph


      I added Ollama Query to send a prompt and optional system prompt to a local
      Ollama server from inside ComfyUI. The node exposed sampling, context, reproducibility,
      and connection settings directly in the graph, then returned the response text,
      raw JSON, and token count for downstream use.'
    id: blk_editorial_comfyui-ollama-nodes
    type: text
  - caption: Captures show the original Ollama Query controls and the separate node
      used to list models from the configured endpoint.
    id: blk_ollama_gallery
    images:
    - alt: Ollama Query node with model selection, prompt, system prompt, sampling,
        seed, context, and endpoint controls
      src: media/screenshot_2026-02-28_16-10-04-1.png
    - alt: Ollama Model List node with trigger, endpoint, model-list, and JSON outputs
      src: media/screenshot_2026-02-28_16-10-26.png
    type: gallery
  - body: '## Pass chat history forward


      Ollama Chat used the local `/api/chat` endpoint, accepted prior messages as
      JSON, and returned the updated history alongside the response. Connecting that
      output into another chat node kept the conversation explicit in the workflow
      instead of storing it in a hidden global session.'
    id: blk_editorial_ollama-chat-history
    type: text
