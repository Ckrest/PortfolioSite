blocks:
- body: '## Create the factual record directly


    A single create operation writes the report’s required context as a complete record.
    The caller supplies the narrative and report facts together, without maintaining
    a server-side wizard session across several responses.


    Evidence remains a separate decision, so recording what happened does not depend
    on choosing every supporting artifact at the same time.'
  id: blk_editorial_restructure-work-report-
  type: text
- code: "flowchart LR\n  Facts[Report facts] --> Create[Create report]\n  Create -->\
    \ Record[Complete record]\n  Operations[Completed tool operations] --> Registry[Handler\
    \ registry]\n  Registry --> Candidates[Evidence candidates]\n  Candidates -->\
    \ Curate[Review and attach]\n  Curate --> Record"
  description: The report is created directly; evidence reaches it through a separate,
    traceable curation path.
  id: blk_create_curate
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Discover evidence from completed operations


    Successful tool operations form the source of evidence candidates. A declarative
    handler registry maps each operation type to the artifact it can produce, so discovery
    starts from a recorded result instead of creating records while merely inspecting
    files.


    Curation reviews the bounded candidate set and attaches selected material to the
    report. Detach keeps that choice reversible without reopening a guided flow.'
  id: blk_operation_evidence_curation
  type: text
