blocks:
- body: '## Toggle the two-part camera pipeline


    I bound Super+O in Wayfire so the virtual camera can start and stop without bringing
    OBS to the foreground. On start, the script launches RVM, waits up to about five
    seconds for its output device to become active, warns if that bounded check times
    out, and then launches OBS minimized. The check sequences the handoff; it does
    not claim an end-to-end camera verification.


    If either OBS or RVM is already running, the same shortcut stops OBS and then
    RVM. Process checks keep repeated presses from leaving one half of the pipeline
    behind, while desktop notifications report the requested transition.'
  id: blk_editorial_virtual-camera-toggle
  type: text
- id: blk_relationship_context_51bf8adf2664
