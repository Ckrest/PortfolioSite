- code: "flowchart LR\n  Press[Press Super+O] --> Running{OBS or RVM running?}\n \
    \ Running -- No --> StartRVM[Start RVM]\n  StartRVM --> Check[Bounded output-device\
    \ check]\n  Check --> StartOBS[Launch OBS minimized]\n  Running -- Yes --> StopOBS[Stop\
    \ OBS]\n  StopOBS --> StopRVM[Stop RVM]"
  description: The shortcut starts the two processes in order or stops both when either
    half is already running.
