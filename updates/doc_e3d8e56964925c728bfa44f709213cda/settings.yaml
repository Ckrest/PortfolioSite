blocks:
- body: '## Hold the compositor''s presented frame


    I built Screen Freeze as a Wayfire plugin that captures an output''s final rendered
    frame into a GPU texture and presents that texture in place of later frames. Applications
    continue running underneath because the compositor freezes only what it displays.
    A separate black state clears the presented output to solid black, and unfreezing
    releases the renderer state and resumes live presentation.


    Wayfire IPC can target one named output or every active output, while status reports
    each output''s exact normal, frozen, or black state.'
  id: blk_editorial_wayfire-screen-freeze
  type: text
- code: "flowchart LR\n  Normal[Live output] -->|freeze| Frozen[Captured GPU texture]\n\
    \  Frozen -->|unfreeze| Normal\n  Normal -->|black| Black[Solid black]\n  Black\
    \ -->|unfreeze| Normal"
  description: Each output moves independently between live presentation, a captured
    texture, and solid black.
  id: blk_screen_freeze
  presentation: content
  sourceMode: inline
  type: mermaid
- commands:
  - command: 'wf-msg screen-freeze/freeze ''{"output": "DP-1"}'''
    output: '{"ok":true}'
  - command: wf-msg screen-freeze/status
    output: "{\n  \"ok\": true,\n  \"outputs\": [\n    {\"name\": \"DP-1\", \"state\"\
      : \"frozen\"},\n    {\"name\": \"HDMI-A-1\", \"state\": \"normal\"}\n  ]\n}"
  - command: 'wf-msg screen-freeze/unfreeze ''{"output": "DP-1"}'''
    output: '{"ok":true}'
  description: A scoped request freezes DP-1 while the other output stays live, then
    releases the same output.
  id: blk_screen_freeze_ipc
  presentation: content
  sourceMode: inline
  type: terminal
date: '2025-12-06'
external_url: https://github.com/Ckrest/screen-freeze
prominence: low
summary: Built a Wayfire plugin that captures the final compositor frame into a GPU
  texture and presents it—or solid black—until an IPC unfreeze request.
