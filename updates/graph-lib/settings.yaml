content:
  blocks:
  - body: '## Compose data and presentation


      Graph Library splits a live visualization into three replaceable pieces: a provider
      returns timestamped values, a Cairo renderer turns them into a line chart or
      gauge, and `GraphWidget` handles GTK drawing and the refresh lifecycle. The
      same widget can use generated data, SQLite history, or live GPU metrics without
      moving acquisition logic into the renderer.'
    id: blk_editorial_graph-lib
    type: text
  - caption: A provider and renderer become one embeddable, independently configurable
      GTK widget.
    code: "provider = SQLiteProvider(\n    db_path=\"metrics.db\",\n    table=\"readings\"\
      ,\n    value_column=\"temperature\",\n    time_column=\"timestamp\",\n    time_range_hours=24,\n\
      )\n\nrenderer = LineChartRenderer()\ngraph = GraphWidget(renderer, provider,\
      \ refresh_interval_ms=1000)\n\ngraph.configure(\n    title=\"Temperature\",\n\
      \    unit=\"°C\",\n    y_min=0,\n    y_max=100,\n    show_current=True,\n)\n\
      \ngraph.start()"
    filename: graph-composition.py
    id: blk_graph_composition
    language: python
    type: code
  - body: '## Swap the source without rewriting the chart


      Each provider returns the same small `DataPoint` structure, keeping database
      queries and hardware sampling out of the drawing code. The included providers
      cover generated example data, configurable SQLite queries, and rolling GPU metrics,
      while custom sources can implement the same `fetch()` interface and optional
      streaming hooks.'
    id: blk_graph_sources
    type: text
  - alt: GTK4 Graph Library showcase with labeled and compact line charts plus circular
      gauges
    caption: One widget API produces labeled time series, compact filled charts, point
      traces, and threshold-colored gauges.
    id: blk_graph_showcase
    src: media/screenshot_2026-02-28_16-26-37-1.png
    type: image
  - body: '## Tune the display at runtime


      Line charts expose labels, units, automatic or fixed ranges, axes, ticks, grids,
      fills, points, colors, and a current-value display. Gauges add configurable
      ranges, thresholds, arc styling, colors, and labels. The widget can also change
      its provider or refresh interval while running and request a redraw when new
      data arrives.'
    id: blk_graph_runtime
    type: text
