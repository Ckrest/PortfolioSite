<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Modular portfolio project architecture</title>
  <desc id="desc">A project folder containing settings, a preview, and content flows through a reusable renderer into a project page assembled from distinct content regions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f100f"/>
      <stop offset="1" stop-color="#171512"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20211f"/>
      <stop offset="1" stop-color="#181917"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b868"/>
      <stop offset="1" stop-color="#bc7d3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d69a52"/>
    </marker>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 3px; fill: #d69a52; }
      .headline { font-size: 52px; font-weight: 720; letter-spacing: -1.5px; fill: #f3eee5; }
      .subhead { font-size: 22px; fill: #b7b0a5; }
      .panel-title { font-size: 22px; font-weight: 680; fill: #f3eee5; }
      .panel-label { font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #9c958b; }
      .file { font-size: 21px; font-weight: 600; fill: #ece6dc; }
      .muted { font-size: 16px; fill: #aaa399; }
      .chip { font-size: 14px; font-weight: 650; fill: #d7c5aa; }
      .page-label { font-size: 16px; font-weight: 650; fill: #ded7cb; }
      .tiny { font-size: 13px; fill: #928b82; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1420" cy="80" r="260" fill="#d69a52" opacity=".035"/>
  <circle cx="120" cy="850" r="320" fill="#7693bc" opacity=".035"/>

  <g class="ui">
    <text class="eyebrow" x="72" y="68">PORTFOLIO CONTENT ARCHITECTURE</text>
    <text class="headline" x="72" y="130">One folder becomes one project page</text>
    <text class="subhead" x="74" y="168">Metadata, assets, and typed content travel together through one reusable renderer.</text>

    
    <g filter="url(#shadow)">
      <rect x="72" y="224" width="430" height="570" rx="24" fill="url(#panel)" stroke="#3a3a36" stroke-width="2"/>
      <path d="M72 276h430" stroke="#383834" stroke-width="2"/>
      <path d="M104 250h25l10 10h146" fill="none" stroke="#d69a52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="panel-title mono" x="151" y="261">diagram-tool/</text>
      <text class="panel-label" x="104" y="320">SELF-CONTAINED PROJECT MODULE</text>

      <rect x="104" y="350" width="366" height="92" rx="14" fill="#272824" stroke="#474740"/>
      <rect x="124" y="373" width="44" height="46" rx="8" fill="#d69a52" opacity=".15"/>
      <path d="M137 385h18M137 394h18M137 403h12" stroke="#e8b868" stroke-width="2.5" stroke-linecap="round"/>
      <text class="file mono" x="188" y="389">settings.yaml</text>
      <text class="muted" x="188" y="416">identity, metadata, content mode</text>

      <rect x="104" y="462" width="366" height="92" rx="14" fill="#272824" stroke="#474740"/>
      <rect x="124" y="485" width="44" height="46" rx="8" fill="#7693bc" opacity=".16"/>
      <circle cx="146" cy="499" r="6" fill="#8fa8ca"/>
      <path d="M132 520l10-11 8 7 7-9 6 13z" fill="#8fa8ca"/>
      <text class="file mono" x="188" y="501">preview.png</text>
      <text class="muted" x="188" y="528">project-owned visual evidence</text>

      <rect x="104" y="574" width="366" height="92" rx="14" fill="#272824" stroke="#474740"/>
      <rect x="124" y="597" width="44" height="46" rx="8" fill="#83aa7a" opacity=".16"/>
      <path d="M136 608h20M136 617h20M136 626h14" stroke="#9bc291" stroke-width="2.5" stroke-linecap="round"/>
      <text class="file mono" x="188" y="613">README.md</text>
      <text class="muted" x="188" y="640">page content beside its assets</text>

      <rect x="104" y="699" width="122" height="36" rx="18" fill="#302b24" stroke="#5b4831"/>
      <text class="chip" x="124" y="722">METADATA</text>
      <rect x="238" y="699" width="96" height="36" rx="18" fill="#252c33" stroke="#3d5268"/>
      <text class="chip" x="258" y="722">ASSETS</text>
      <rect x="346" y="699" width="124" height="36" rx="18" fill="#283027" stroke="#40533d"/>
      <text class="chip" x="366" y="722">CONTENT</text>
    </g>

    
    <path d="M518 509 C566 509 579 509 620 509" fill="none" stroke="#d69a52" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M984 509 C1032 509 1045 509 1086 509" fill="none" stroke="#d69a52" stroke-width="3" marker-end="url(#arrow)"/>

    
    <g filter="url(#shadow)">
      <rect x="636" y="292" width="332" height="434" rx="24" fill="url(#panel)" stroke="#4a4134" stroke-width="2"/>
      <rect x="636" y="292" width="332" height="70" rx="24" fill="#24231f"/>
      <path d="M636 338h332" stroke="#443e34" stroke-width="2"/>
      <circle cx="675" cy="327" r="10" fill="url(#accent)"/>
      <text class="panel-title" x="700" y="335">Detail-page renderer</text>
      <text class="panel-label" x="672" y="402">CONTENT MODE</text>

      <rect x="672" y="428" width="260" height="54" rx="12" fill="#302b24" stroke="#684c2f"/>
      <text class="page-label mono" x="696" y="461">README</text>
      <text class="tiny" x="819" y="460">Markdown</text>

      <rect x="672" y="494" width="260" height="54" rx="12" fill="#252623" stroke="#454640"/>
      <text class="page-label mono" x="696" y="527">STRUCTURED</text>
      <text class="tiny" x="837" y="526">Typed sections</text>

      <rect x="672" y="560" width="260" height="54" rx="12" fill="#252623" stroke="#454640"/>
      <text class="page-label mono" x="696" y="593">PDF</text>
      <text class="tiny" x="839" y="592">Embedded document</text>

      <rect x="672" y="626" width="260" height="54" rx="12" fill="#252623" stroke="#454640"/>
      <text class="page-label mono" x="696" y="659">MINIMAL</text>
      <text class="tiny" x="839" y="658">Metadata + media</text>
    </g>

    
    <g filter="url(#shadow)">
      <rect x="1102" y="224" width="426" height="570" rx="24" fill="#171815" stroke="#3a3a36" stroke-width="2"/>
      <rect x="1102" y="224" width="426" height="54" rx="24" fill="#20211e"/>
      <circle cx="1132" cy="251" r="5" fill="#7b776e"/>
      <circle cx="1149" cy="251" r="5" fill="#7b776e"/>
      <circle cx="1166" cy="251" r="5" fill="#7b776e"/>
      <text class="panel-label" x="1202" y="256">REUSABLE PROJECT PAGE</text>

      <rect x="1134" y="306" width="362" height="90" rx="14" fill="#272824" stroke="#474740"/>
      <text class="page-label" x="1162" y="344">Project header</text>
      <rect x="1162" y="360" width="238" height="7" rx="3.5" fill="#68655e"/>
      <rect x="1162" y="375" width="186" height="7" rx="3.5" fill="#4c4b46"/>

      <rect x="1134" y="412" width="362" height="142" rx="14" fill="#232522" stroke="#474740"/>
      <rect x="1152" y="430" width="326" height="106" rx="9" fill="#171a1b"/>
      <path d="M1178 514l72-54 56 43 48-34 96 67h-272z" fill="#394551"/>
      <circle cx="1398" cy="461" r="16" fill="#d69a52" opacity=".72"/>
      <text class="page-label" x="1158" y="581">Preview</text>
      <rect x="1240" y="564" width="72" height="26" rx="13" fill="#302b24" stroke="#5b4831"/>
      <text class="tiny" x="1261" y="582">TAG</text>
      <rect x="1324" y="564" width="74" height="26" rx="13" fill="#252c33" stroke="#3d5268"/>
      <text class="tiny" x="1343" y="582">LINK</text>

      <rect x="1134" y="610" width="362" height="142" rx="14" fill="#272824" stroke="#474740"/>
      <text class="page-label" x="1162" y="645">Content sections</text>
      <rect x="1162" y="667" width="292" height="7" rx="3.5" fill="#68655e"/>
      <rect x="1162" y="684" width="256" height="7" rx="3.5" fill="#4c4b46"/>
      <rect x="1162" y="701" width="274" height="7" rx="3.5" fill="#4c4b46"/>
      <rect x="1162" y="718" width="214" height="7" rx="3.5" fill="#4c4b46"/>
    </g>

    <text class="panel-label" x="174" y="840">ONE DIRECTORY</text>
    <text class="panel-label" x="720" y="840">ONE RENDERING PATH</text>
    <text class="panel-label" x="1216" y="840">MANY PAGE SHAPES</text>
  </g>
</svg>
