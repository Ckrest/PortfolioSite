blocks:
- body: '## Copy evidence when it is attached


    Work Report copies artifact material into a report-owned directory as soon as
    it is attached. Images, videos, and documents come from their source files; code,
    terminal output, and structured data are written from the captured content. The
    stored artifact points to that owned material, so later use no longer depends
    on its source path.'
  id: blk_editorial_copy-at-capture-artifact
  type: text
- code: "flowchart TD\n  Artifact[Typed artifact] --> Report[Create report row]\n\
    \  Report --> Material{Artifact material}\n  Material -->|Image, video, document|\
    \ Copy[Copy source file]\n  Material -->|Code, terminal, data| Write[Write captured\
    \ content]\n  Copy & Write --> Owned[Report-owned path]\n  Owned --> Record[Store\
    \ artifact record]"
  description: The report ID selects the storage directory before each artifact record
    is updated with its owned path.
  id: blk_copy_capture
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Create the report and its material in two phases


    The report ID determines the storage directory, so creation first inserts the
    report row, then stores each artifact and records its owned path. Evidence added
    to an existing report uses the same storage helper, keeping the report and its
    material together.'
  id: blk_two_phase_report_capture
  type: text
date: '2026-01-28'
prominence: low
summary: Copied attached files and reconstructed text artifacts into report-owned
  storage at capture time, so each Work Report retains the material it references.
tags:
- Infrastructure
- Python
- PostgreSQL
title: Made Work Report artifacts durable at capture time
