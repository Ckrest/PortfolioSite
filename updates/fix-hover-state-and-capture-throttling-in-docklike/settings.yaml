content:
  blocks:
  - body: '## Make hover behavior explicit


      Docklike now coordinates the panel button, preview popup, and menu items through
      a dedicated `HoverManager` with closed, opening, open, and grace-period states.
      Pointer movement feeds one state machine, keeping the menu available while moving
      into it and clearing the hover style when the interaction ends.'
    id: blk_editorial_fix-hover-state-and-capt
    type: text
  - caption: One coordinator owns the handoff between the panel and preview menu,
      then adapts live refresh scheduling to capture load.
    code: "flowchart LR\n  Enter[Pointer enters] --> Open[Show preview]\n  Leave[Pointer\
      \ leaves button] --> Grace[Keep menu open briefly]\n  Grace -->|Pointer enters\
      \ menu| Open\n  Grace -->|Timeout| Close[Clear state and hide]\n  Open --> Queue{Capture\
      \ queue busy?}\n  Queue -->|No| All[Refresh all windows]\n  Queue -->|Yes| Rotate[Round-robin\
      \ refresh]"
    id: blk_hover_capture
    presentation: content
    sourceMode: inline
    summary: One coordinator owns the handoff between the panel and preview menu,
      then adapts live refresh scheduling to capture load.
    type: mermaid
  - body: '## Share capture time fairly


      Live refresh requests now use queue depth to choose how captures are admitted.
      At normal load, every visible window can request a fresh thumbnail; when the
      queue becomes busy, round-robin selection rotates the next accepted request
      between windows.'
    id: blk_docklike_capture_fairness
    type: text
