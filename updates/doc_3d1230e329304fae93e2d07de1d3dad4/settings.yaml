blocks:
- body: '## Make source and destination explicit


    Constellation Framework records both where a package’s code comes from and where
    its maintained version is published. I clarified those roles across trait guidance,
    tool descriptions, and validation messages: the upstream declaration identifies
    the source used for fetching and merging, while the publication declaration identifies
    the push destination.


    I also aligned remote naming so the configured publication destination uses the
    same convention across repository types.'
  id: blk_publish_context
  type: text
- code: "flowchart LR\n P[\"Maintained<br/>package\"] --> V[\"Validate<br/>package\"\
    ]\n V --> D[\"Push to declared<br/>publication destination\"]"
  description: The framework publication tool validates the maintained package before
    pushing to its declared destination.
  id: blk_publish_path
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Guide agent publishing through the checked path


    I updated the agent command hooks to reject direct Git and VCSH push commands
    and direct publishing through Constellation’s publication tool, which validates
    the package before pushing.


    The guidance and error messages point to that same operation. This makes the intended
    publishing route explicit and keeps package checks attached to the action that
    distributes the code.'
  id: blk_publish_result
  type: text
date: '2026-02-22'
kind: update
prominence: low
summary: Clarified source and publication destinations in Constellation Framework,
  then directed agent publishing actions through the framework’s validation step.
tags:
