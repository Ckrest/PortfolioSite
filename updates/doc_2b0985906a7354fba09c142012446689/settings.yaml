blocks:
- body: '## Keep outputs beside their provenance


    Successful tool operations carry `_outputs` descriptors in their configuration,
    including the generated file’s path, type, and metadata. Work Report discovers
    evidence candidates from those descriptors instead of joining through a separate
    row created for every generated file.


    The artifact table remains reserved for material explicitly attached to a Work
    Report, separating generated outputs from curated evidence.'
  id: blk_artifact_config_story
  type: text
- code: "{\n  \"tool_name\": \"system-visualizer\",\n  \"operation_type\": \"system_flowchart\"\
    ,\n  \"status\": \"success\",\n  \"config\": {\n    \"_outputs\": [\n      {\n\
    \        \"file_path\": \"/tmp/flowchart.mmd\",\n        \"file_type\": \"mermaid\"\
    ,\n        \"metadata\": {\n          \"name\": \"system boundary\"\n        }\n\
    \      }\n    ]\n  }\n}"
  description: A successful operation carries the descriptor Work Report uses to discover
    its generated file.
  filename: operation-output.json
  id: blk_artifact_config_shape
  language: json
  presentation: content
  sourceMode: attached
  src: media/operation-output.json
  type: code
- body: '## Carry each type through the same vocabulary


    Handler configuration identifies which tool operation can produce evidence, the
    source registry defines how that evidence is captured, and the artifact-to-block
    map selects its Portfolio Editor presentation. The aligned mappings cover code,
    terminal output, documents, generated images, audio, and Mermaid diagrams.


    The registries still serve different responsibilities; the improvement is that
    supported types match from discovery through presentation, while unknown or missing
    outputs remain explicit.'
  id: blk_artifact_type_alignment
  type: text
