content:
  blocks:
  - body: '## Keep the useful choices


      I built the node set around a short iteration loop: define pools of prompt fragments,
      queue a generation, freeze the selections that worked, and rerun the rest. Frozen
      values were stored in the workflow, so refining one part of a prompt did not
      require copying the whole combination into a new graph.'
    id: blk_editorial_comfyui-easy-randomize
    type: text
  - caption: Each queue run changed only the selections that were not frozen.
    code: "flowchart LR\n  Pools[Define item pools] --> Select[Select values]\n  Select\
      \ --> Preview[Generate and preview]\n  Preview --> Freeze[Freeze useful choices]\n\
      \  Freeze --> Select\n  Preview --> Record[Record final selections]"
    id: blk_easy_randomize_flow
    type: mermaid
  - body: '## Keep the workflow explicit


      Item Pool and Smart Selector nodes kept the available choices visible in the
      graph and supported random or sequential selection. String joiners, template
      fillers, and a freezable combiner assembled those choices into ordinary ComfyUI
      inputs instead of hiding prompt construction inside one generator.'
    id: blk_editorial_easy-randomize-workflow
    type: text
  - caption: Later captures of the maintained interface show the original selection
      nodes and the ten-input freezable combiner.
    id: e7f5fe32-e7ef-436e-88c0-fe4becb90964
    images:
    - alt: ComfyUI Easy Randomize nodes for item pools, random and smart selection,
        templates, selection recording, and image output
      src: media/screenshot_2026-02-28_16-56-44-1.png
    - alt: Freezable String Combiner node with ten string inputs, per-input freeze
        controls, and a freeze-all control
      src: media/screenshot_2026-02-28_16-57-32.png
    type: gallery
  - body: '## Save the choices with the image


      Selection Recorder collected the chosen values as JSON, and Save Image with
      Selections embedded that record in the PNG metadata. A successful generation
      kept both the image and the inputs that produced it, making the result reproducible
      without relying on memory or a screenshot of the graph.'
    id: blk_editorial_easy-randomize-metadata
    type: text
