blocks:
- body: '## Start every detail page with usable structure


    Detail pages now place preview media, tags, and links inside one metadata wrapper,
    keeping the transition into page content consistent when optional fields are absent.
    When a project has no explicit content blocks, the renderer looks for its README
    and uses it as the page body. New Portfolio Editor drafts begin with a README
    block so the same starting point is visible while authoring.'
  id: blk_editorial_detail-page-defaults-and
  type: text
- description: Portfolio detail page showing JavaScript, Frontend, and CSS tags with
    a GitHub link above README content headed PortfolioSite. With no explicit content
    blocks configured, the detail page renders the project README beneath its metadata.
  id: blk_detail_readme_fallback_visual
  presentation: wide
  src: media/detail-readme-fallback.png
  type: image
- body: '## Catch incomplete content before publication


    The validation path now distinguishes objective errors from editorial warnings.
    Missing link destinations and invalid required fields stop the save or build,
    while placeholder summaries and empty detail content are surfaced for review.
    Optional page fields remain flexible without letting incomplete source data pass
    silently.'
  id: blk_detail_validation_story
  type: text
date: '2026-01-27'
