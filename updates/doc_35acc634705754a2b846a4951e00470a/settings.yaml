blocks:
- body: '## Make every artifact recognizable before import


    Work Report cards preview image, code, terminal, video, document, and data evidence
    before it enters a draft. When staged material still carries an absolute filesystem
    path, Portfolio Editor''s preview bridge routes it through the artifact-preview
    endpoint and supplies the live page with a valid preview URL.'
  id: blk_editorial_phase-5-fix-artifact-dis
  type: text
- description: 'Work Report card titled Test: All 6 artifact types with preview cards
    for image, code, terminal, video, document, and data evidence. Work Report cards
    distinguish all six evidence categories before they enter the draft.'
  id: blk_artifact_report_previews
  kind: image
  presentation: intrinsic
  src: media/artifact-types-work-report.png
  type: image
- body: '## Preserve artifacts through save and render


    Saving copies local video alongside other asset-bearing blocks and rewrites its
    source to a project-relative media path. The detail renderer uses native video
    playback for local files and an iframe for supported hosted media. Shared path
    resolution covers images, galleries, comparisons, and PDFs through the same preview
    and save flow.'
  id: blk_artifact_save_render
  type: text
- code: "flowchart LR\n  Report[Work Report card] --> Draft[Editor draft]\n  Draft\
    \ --> Preview[Live preview]\n  Draft --> Media[Saved project media]\n  Media -->\
    \ Page[Detail-page block]"
  description: One artifact keeps a traceable path from its Work Report preview through
    editor state and saved portfolio output.
  id: blk_four_renderers
  presentation: content
  sourceMode: inline
  type: mermaid
date: '2026-01-28'
external_url: https://github.com/Ckrest/PortfolioSite
prominence: low
summary: Aligned Work Report previews, Portfolio Editor path handling, saved media,
  and detail-page blocks so artifacts remain usable from report intake through the
  rendered page.
