blocks:
- body: '## Coordinate animations with power actions


    Shutdown Effect gives each animation two explicit handoff points. `READY` means
    the overlay is visible, and `BLACK` means the display is fully covered. Power
    Manager listens for those signals before advancing to the selected power action.


    After `BLACK`, the animation holds its final frame through the handoff, keeping
    the display covered until the action takes over.'
  id: blk_editorial_shutdown-effect
  type: text
- body: '## Plug in different visual effects


    Animation discovery gives packaged and custom effects the same interface. Each
    effect implements the shared lifecycle, allowing the renderer and visual style
    to change without changing the power workflow.


    The fire effect uses that boundary to spread across the desktop, cover the prior
    scene, and hold the final black frame while the action proceeds. Other visual
    effects can hook into the same lifecycle.'
  id: blk_shutdown_effect_visual_hooks
  type: text
- description: The fire transition spreads across the desktop and holds a covered
    frame through the power-action handoff.
