blocks:
- body: '## Give each timeline item the right amount of space


    I replaced the timeline’s one-size-fits-all markup with a shared entry renderer
    used by the timeline, featured work, and standalone cards. Projects can appear
    as a full media card, a compact preview, or a small icon-and-title row, while
    GIF and video previews follow the same media path as static images.'
  id: blk_editorial_site-update-2026-01-16
  type: text
- code: "flowchart LR\n  Data[Project data] --> Entry[Shared entry renderer]\n  Entry\
    \ --> Large[Large media card]\n  Entry --> Compact[Compact preview]\n  Entry -->\
    \ Small[Small icon row]\n  Small --> Bundle[Expandable bundle]\n  Timeline[Filters\
    \ and selection] --> Bundle\n  Timeline --> URL[Shareable URL state]"
  description: Shared project data controls presentation depth, while timeline filters
    and selections remain addressable through the URL.
  id: blk_timeline_media
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Keep filtering and bundling in sync


    Small entries can combine into expandable bundles with an icon strip. Bundling
    is recalculated after filters are applied, so a narrow result returns to a normal
    entry instead of leaving a misleading group. The URL preserves the selected tags,
    project group, and entry, along with whether connecting lines are shown by shared
    tag, by project group, or hidden. The same timeline view can therefore be reopened
    directly.'
  id: blk_timeline_filtering
  type: text
date: '2026-01-16'
external_url: https://github.com/Ckrest/PortfolioSite
