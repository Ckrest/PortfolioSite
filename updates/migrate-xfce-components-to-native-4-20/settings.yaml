content:
  blocks:
  - body: '## Decide separately for each fork


      I audited three XFCE components before moving the desktop to the 4.20 line.
      The clipboard-manager copy matched upstream, so I archived it. The panel still
      needed three focused patches—for a fixed-size child, configurable show-desktop
      width, and Wayland pointer safety—so I rebased those changes onto the newer
      upstream branch. The libxfce4ui fork stayed in place because its systemd-scope
      launching still had no upstream equivalent.'
    id: blk_editorial_migrate-xfce-components-
    type: text
  - caption: The migration disposition followed the actual delta of each component
      rather than one fleet-wide rule.
    code: "flowchart TD\n  Audit[Audit each component] --> Difference{Local behavior\
      \ still needed?}\n  Difference -->|No| Archive[Archive unchanged copy]\n  Difference\
      \ -->|Focused patch set| Rebase[Rebase panel onto XFCE 4.20]\n  Difference -->|No\
      \ upstream equivalent| Retain[Keep systemd integration fork]\n  Archive -->\
      \ Verify[Verify migrated desktop session]\n  Rebase --> Verify\n  Retain -->\
      \ Verify"
    id: blk_xfce_migration
    presentation: content
    sourceMode: inline
    summary: The migration disposition followed the actual delta of each component
      rather than one fleet-wide rule.
    type: mermaid
  - body: '## Preserve the panel behavior on the new base


      The rebase kept the thin-strip layout, the 10-pixel show-desktop width, and
      the Wayland crash fixes while taking the upstream changes around them. I backed
      up the live XFCE configuration, built the custom panel, loaded all 15 plugins,
      verified the button-width property, and observed the migrated session without
      errors.


      The result is a smaller, explicit maintenance surface: no fork where there is
      no difference, three isolated panel patches where the layout still depends on
      them, and one retained library fork for systemd-scoped application launches.'
    id: blk_xfce_panel_verification
    type: text
