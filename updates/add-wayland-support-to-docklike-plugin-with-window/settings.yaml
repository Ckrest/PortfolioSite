content:
  blocks:
  - body: '## Rebuild the taskbar around Wayland


      Docklike now follows Wayland events for window creation, titles, application
      identity, state changes, activation, and removal. Application identifiers are
      matched to desktop entries so open windows remain grouped beneath the correct
      pinned launcher.


      Taskbar actions—including activation, minimizing, maximizing, and closing—now
      operate through this Wayland-backed model.'
    id: blk_editorial_add-wayland-support-to-d
    type: text
  - body: '## Add a dedicated preview pipeline


      A new capture manager owns image-copy sessions, queues requests, converts compositor
      buffers into thumbnails, and delivers them to the panel menu. Keeping capture
      separate from window tracking allows one or several live previews to appear
      beneath an application without blocking the panel.'
    id: blk_docklike_capture_pipeline
    type: text
  - alt: Docklike panel menu showing live previews for two open file manager windows
    caption: Each open window appears as a distinct live preview beneath its grouped
      application.
    id: blk_docklike_live_previews
    presentation: intrinsic
    src: media/docklike-live-window-previews.png
    type: image
  - body: '## Preserve the Docklike workflow


      Layer-shell menus remain anchored to the panel and present each application’s
      pinned state, grouped windows, titles, close controls, and previews. The result
      keeps Docklike’s compact launcher and taskbar workflow while moving its window
      handling to Wayland.'
    id: blk_docklike_workflow
    type: text
  - alt: Docklike panel demonstrating pinned applications, grouped windows, reordering,
      and quick switching
    caption: Pinned applications, grouped windows, reordering, and quick switching
      remain available directly from the XFCE panel.
    id: blk_docklike_later_ui
    presentation: intrinsic
    src: media/screenshot_2026-03-01_20-15-00.png
    type: image
