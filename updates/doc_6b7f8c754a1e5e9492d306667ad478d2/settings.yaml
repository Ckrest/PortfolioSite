blocks:
- body: '## Compose the page from independent sections


    I split the page into independent modules for the header, hero, featured work,
    roadmap, timeline, contact, and footer. Each section owns its HTML, CSS, and JavaScript,
    while shared layers handle design tokens, themes, backgrounds, base elements,
    and layout.


    A site configuration controls which sections load and in what order. A small section
    loader reads that configuration and assembles the homepage.'
  id: blk_editorial_restructure-portfolio-si
  type: text
- code: "flowchart TD\n  Config[Section order and visibility] --> Loader[Section loader]\n\
    \  Header[Header module] --> Loader\n  Hero[Hero module] --> Loader\n  Work[Featured,\
    \ roadmap, and timeline modules] --> Loader\n  Contact[Contact and footer modules]\
    \ --> Loader\n  Styles[Shared tokens, themes, and layout] --> Loader\n  Loader\
    \ --> Page[Composed homepage]"
  description: Section configuration, independent modules, and shared visual layers
    meet in the composed homepage.
  id: blk_modular_site
  presentation: content
  sourceMode: inline
  type: mermaid
