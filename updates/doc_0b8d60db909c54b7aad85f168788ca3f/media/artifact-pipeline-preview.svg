<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Typed evidence becomes editable portfolio blocks</title>
  <desc id="desc">Screenshots, code, terminal output, comparisons, and metrics move from Work Report through matching Portfolio Editor blocks into a rendered portfolio page.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1c"/>
      <stop offset="0.55" stop-color="#10142a"/>
      <stop offset="1" stop-color="#16102a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151c35"/>
      <stop offset="1" stop-color="#10162a"/>
    </linearGradient>
    <linearGradient id="editor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191a3a"/>
      <stop offset="1" stop-color="#14132d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ce1ef"/>
      <stop offset="0.5" stop-color="#8075ff"/>
      <stop offset="1" stop-color="#e65bcc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#03050d" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="118" cy="780" r="280" fill="#2bd7e5" opacity="0.055"/>
  <circle cx="1460" cy="70" r="300" fill="#df55c7" opacity="0.06"/>
  <path d="M0 760C280 630 440 835 745 718S1230 606 1600 730V900H0Z" fill="#6573ff" opacity="0.025"/>

  <text x="68" y="67" fill="#61e4ee" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="5">EVIDENCE PIPELINE</text>
  <text x="68" y="128" fill="#f5f3ff" font-family="Inter, Arial, sans-serif" font-size="49" font-weight="750">Capture once. Edit as blocks. Render on the page.</text>
  <text x="70" y="168" fill="#b9bfd8" font-family="Inter, Arial, sans-serif" font-size="22">Typed artifacts move from Work Report into editable portfolio content.</text>

  
