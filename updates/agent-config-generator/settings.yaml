content:
  blocks:
  - body: '## Generate every configuration from shared instructions


      I built Agent Config Generator around a single `AGENTS.md` containing the conventions
      that should reach every coding agent. For each supported target, the CLI prepends
      any target-specific instructions and writes the combined text to the filename
      that tool expects.


      The initial catalog covers three agent configurations. Output destinations can
      be moved with an optional YAML file, while the supported target definitions
      remain explicit in the script.'
    id: blk_editorial_agent-config-generator
    type: text
  - caption: Each target reuses the shared conventions while keeping its own preamble
      and destination.
    code: "flowchart LR\n  Shared[Shared AGENTS.md] --> Combine[Combine instructions]\n\
      \  Target[Target-specific file] --> Combine\n  Combine --> Preview[Dry run or\
      \ diff]\n  Combine --> Write[Write target config]\n  Mapping[Optional output\
      \ mapping] --> Write"
    id: blk_agent_config
    presentation: content
    sourceMode: inline
    summary: Each target reuses the shared conventions while keeping its own preamble
      and destination.
    type: mermaid
  - body: '## Review the fan-out before writing


      The CLI can generate every supported target or one selected target, list the
      configured destinations, print generated content without writing, and show a
      unified diff against the file already on disk. Its output remains ordinary text,
      so each synchronization can be inspected and versioned like any other change.


      Adding another agent requires an explicit target definition and, when needed,
      a small target-specific file; the shared conventions stay untouched.'
    id: blk_editorial_agent_config_review
    type: text
  - caption: Listing, diffing, and dry-run modes expose the generated fan-out before
      files are changed.
    code: 'python main.py --list

      python main.py --target claude --diff

      python main.py --dry-run'
    filename: agent-config-generator.sh
    id: blk_agent_config_cli
    language: shell
    presentation: content
    sourceMode: inline
    type: code
