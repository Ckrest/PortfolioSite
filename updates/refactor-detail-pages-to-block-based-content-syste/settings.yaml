content:
  blocks:
  - body: '## Turn each project into a self-contained module


      Each project now lives in its own directory with its metadata, links, visuals,
      and long-form content. The site discovers those project modules and assembles
      its shared portfolio data from them.


      Adding or revising a project means editing one contained source instead of coordinating
      metadata and page content in different places.'
    id: blk_editorial_refactor-detail-pages-to
    type: text
  - body: '## Render every project through one shared page


      A shared page renderer supplies the consistent title, summary, preview, tags,
      and links, then renders the project’s content blocks in their configured order.


      The surrounding structure stays consistent while each project controls the blocks
      that make up its page.'
    id: blk_shared_project_page
    type: text
  - alt: Portfolio project page editor with independently editable text, image, and
      video blocks
    caption: Text, image, and video blocks can be moved and edited independently within
      the page.
    id: 6fc110ee-e5f2-43da-97eb-923637667ca6
    presentation: intrinsic
    src: media/screenshot_2026-02-28_15-47-40.png
    type: image
  - body: '## Compose pages from reusable blocks


      Text, images, video, galleries, README content, PDFs, and groups each act as
      independent content blocks. An editor can insert, remove, reorder, or revise
      one block without restructuring the rest of the page.


      Group blocks keep related content together while preserving the same modular
      editing model.'
    id: blk_initial_block_types
    type: text
  - body: '## Edit against the rendered page


      The editor works with the same ordered block document used by the detail page.
      Adding, moving, or updating a block immediately changes the preview, keeping
      authoring and output on one shared structure.'
    id: blk_project_schema_and_preview
    type: text
