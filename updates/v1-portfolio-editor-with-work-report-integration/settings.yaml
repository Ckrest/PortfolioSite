content:
  blocks:
  - body: '## Turn portfolio site authoring into a visual workflow


      Portfolio Editor brings completed Work Reports, project metadata, content blocks,
      and the rendered detail page into one web application. Its Flask backend reads
      report records from PostgreSQL and manages Portfolio Site project sources, while
      the browser keeps those inputs visible within one editing session.


      The interface is divided into Reports, Projects, Blocks, and a live preview.
      Project source becomes forms and composable blocks, so the page can be shaped
      and inspected through the same interface that holds its supporting material.'
    id: blk_v1_editor_workflow
    type: text
  - id: blk_ref_portfolio_site
    slug: portfolio-site
    type: related-mini
  - caption: Work Report records, project fields, and seven block types meet in one
      editing session that drives the real page preview and structured project source.
    code: "flowchart LR\n  Reports[Work Report records] --> Editor[Portfolio Editor\
      \ session]\n  Projects[Project fields] --> Editor\n  Palette[Seven block types]\
      \ --> Editor\n  Editor --> Preview[Live Site preview]\n  Editor --> Source[Structured\
      \ project source]"
    id: blk_v1_editor_flow
    presentation: content
    sourceMode: inline
    summary: Work Report records, project fields, and seven block types meet in one
      editing session that drives the real page preview and structured project source.
    type: mermaid
  - body: '## Move Work Report material into the page


      Opening a completed Work Report in the Reports panel exposes its description,
      reasoning, metadata, and available material as separate source fields. Each
      field can be dragged into project metadata or the page’s block list, while the
      complete report can seed a new portfolio project for further editing.'
    id: blk_v1_editor_report_material
    type: text
  - id: blk_ref_work_report
    slug: work-report
    type: related-mini
  - alt: Screenshot_2026-08-26_15-34-39_Region.png
    caption: An expanded Work Report exposes draggable content, artifacts, and metadata
      beside the portfolio page being assembled.
    evidenceQualifier: ''
    id: b32122ca-1403-406c-8fcd-4ea46d366245
    presentation: intrinsic
    src: assets/Screenshot_2026-08-26_15-34-39_Region.png
    type: image
  - body: '## Shape the project around that material


      The Projects panel manages the fields used by timeline cards and detail pages:
      title, summary, date, presentation size, tags, links, icon, and preview. A controlled
      tag vocabulary and autocomplete keep the metadata consistent while every field
      remains editable.'
    id: blk_v1_editor_project_fields
    type: text
  - body: '## Compose Portfolio Site pages from seven block types


      The Blocks panel offers text, image, video, gallery, README, PDF, and group
      blocks. A block can start empty from the palette or be filled with material
      brought over from a report. Groups let related blocks share one section while
      retaining their individual types.


      Page content stays as structured data rather than rendered HTML. That keeps
      reordering and type-specific editing straightforward while Portfolio Site remains
      responsible for typography, responsive layout, media behavior, and links.'
    id: blk_v1_editor_blocks
    type: text
  - caption: The Projects and Blocks tabs keep structured metadata and seven composable
      block types beside the rendered page.
    fit: contain
    id: blk_v1_editor_gallery
    images:
    - alt: Portfolio Editor Projects tab with project metadata controls beside the
        rendered portfolio page
      src: media/screenshot_2026-01-27_20-40-46.png
    - alt: Portfolio Editor Blocks tab with text, image, video, gallery, README, PDF,
        and group controls beside the rendered detail page
      src: media/screenshot_2026-01-27_20-40-07.png
    presentation: wide
    type: gallery
  - body: '## Edit against the real renderer


      The right pane loads Portfolio Site’s detail page in a same-origin iframe. An
      injected bridge sends the in-memory project and block state into the renderer
      and maps clicks in the page back to the corresponding field or block in the
      Editor.


      The preview therefore uses the Site’s real CSS and block behavior while keeping
      authoring controls outside the public page. Changes can be inspected in memory
      before the structured project source is saved.'
    id: blk_v1_editor_preview
    type: text
