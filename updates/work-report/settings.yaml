content:
  blocks:
  - body: '## Capture the work while it is still fresh


      Work Report turns a completed task into a structured record while its reasoning
      and evidence are still available. Each report keeps the project, title, summary,
      description, rationale, status, tags, technologies, and references to relevant
      files or images together instead of leaving that context scattered across terminal
      history and memory.


      Creating a report also records the current commit and derives its file and line
      statistics automatically.'
    id: blk_work_report_story
    type: text
  - caption: Each report combines human context with repository facts, then makes
      the result available through recent, search, and detail commands.
    code: "flowchart LR\n  Work[Completed work] --> Create[Create report]\n  Context[Description\
      \ and reasoning] --> Create\n  Evidence[File and image references] --> Create\n\
      \  Git[Commit and diff stats] --> Create\n  Create --> History[(PostgreSQL history)]\n\
      \  History --> Recent[Recent reports]\n  History --> Search[Search by project\
      \ or tag]\n  History --> Detail[Full report]"
    id: blk_work_report_boundary
    presentation: content
    sourceMode: inline
    summary: Each report combines human context with repository facts, then makes
      the result available through recent, search, and detail commands.
    type: mermaid
  - body: '## Search structured work history


      The command-line interface lists recent work, searches by project or validated
      tag, and expands one report into its full description, reasoning, evidence references,
      and Git statistics. A controlled vocabulary gives tags consistent names, making
      reports easier to find and reuse.'
    id: blk_work_report_search
    type: text
  - alt: Terminal showing a structured Work Report with project details, description,
      reasoning, evidence references, tags, technologies, and Git statistics.
    caption: A report detail view brings narrative, evidence references, tags, technologies,
      and Git statistics into one readable record.
    id: blk_work_report_cli
    presentation: intrinsic
    src: media/work-report-cli.png
    type: image
  - body: '## Keep the source record separate from presentation


      A Work Report is the factual technical record of a task. It can preserve implementation
      detail and local evidence while portfolio presentation remains a separate editorial
      layer, keeping the source material useful without treating an internal report
      as finished public copy.'
    id: blk_work_report_presentation
    type: text
