<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio icon selection flow</title>
  <desc id="desc">An imported portfolio update with Wayland, Python, and Feature tags passes through an ordered selector. Domain tags take priority, skill tags are considered next, and work-type tags are ignored. The selector assigns a layers icon to the resulting update card.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191815"/>
      <stop offset="1" stop-color="#10110f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b84b"/>
      <stop offset="1" stop-color="#d97745"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#050504" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#8b8375"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#background)"/>
  <circle cx="1500" cy="60" r="290" fill="#b45309" opacity="0.09"/>
  <circle cx="60" cy="850" r="270" fill="#3f6f5d" opacity="0.1"/>

  <text x="100" y="105" fill="#f2b84b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="5">PORTFOLIO EDITOR</text>
  <text x="100" y="170" fill="#fbf7ef" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="750">From tags to a ready card</text>
  <text x="100" y="218" fill="#aaa294" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">A fixed priority turned report metadata into a useful visual identity.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="300" width="400" height="410" rx="28" fill="#211f1a" stroke="#4b453a" stroke-width="2"/>
    <rect x="590" y="300" width="430" height="410" rx="28" fill="#211f1a" stroke="#4b453a" stroke-width="2"/>
    <rect x="1110" y="300" width="390" height="410" rx="28" fill="#211f1a" stroke="#4b453a" stroke-width="2"/>
  </g>

  <text x="140" y="355" fill="#aaa294" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="3">IMPORTED UPDATE</text>
  <text x="140" y="410" fill="#fbf7ef" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="700">Wayland</text>
  <text x="140" y="450" fill="#fbf7ef" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="700">desktop tools</text>
  <text x="140" y="494" fill="#aaa294" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">Tags arrived with the report.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">
    <rect x="140" y="540" width="136" height="50" rx="25" fill="#5d4215" stroke="#f2b84b"/>
    <text x="208" y="572" fill="#fff4d6" text-anchor="middle">Wayland</text>
    <rect x="290" y="540" width="122" height="50" rx="25" fill="#345b4c" stroke="#8bbf9f"/>
    <text x="351" y="572" fill="#e4f3eb" text-anchor="middle">Python</text>
    <rect x="140" y="608" width="126" height="50" rx="25" fill="#3b3730" stroke="#7d7568"/>
    <text x="203" y="640" fill="#d8d1c5" text-anchor="middle">Feature</text>
  </g>

  <text x="630" y="355" fill="#aaa294" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="3">ORDERED SELECTOR</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <circle cx="665" cy="415" r="22" fill="#7b5314"/>
    <text x="665" y="423" fill="#fff4d6" text-anchor="middle" font-size="20" font-weight="800">1</text>
    <text x="710" y="409" fill="#fbf7ef" font-size="24" font-weight="700">Domain first</text>
    <text x="710" y="439" fill="#aaa294" font-size="18">Wayland described the subject.</text>

    <circle cx="665" cy="515" r="22" fill="#345b4c"/>
    <text x="665" y="523" fill="#e4f3eb" text-anchor="middle" font-size="20" font-weight="800">2</text>
    <text x="710" y="509" fill="#fbf7ef" font-size="24" font-weight="700">Skills next</text>
    <text x="710" y="539" fill="#aaa294" font-size="18">Python remained available</text>
    <text x="710" y="563" fill="#aaa294" font-size="18">as the next match.</text>

    <circle cx="665" cy="625" r="22" fill="#4a443b"/>
    <text x="665" y="633" fill="#e9e2d7" text-anchor="middle" font-size="20" font-weight="800">3</text>
    <text x="710" y="619" fill="#fbf7ef" font-size="24" font-weight="700">Work type ignored</text>
    <text x="710" y="649" fill="#aaa294" font-size="18">“Feature” described activity,</text>
    <text x="710" y="673" fill="#aaa294" font-size="18">not the subject.</text>
  </g>

  <line x1="520" y1="505" x2="560" y2="505" stroke="#8b8375" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1040" y1="505" x2="1080" y2="505" stroke="#8b8375" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="1150" y="355" fill="#aaa294" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="3">ASSIGNED RESULT</text>
  <g transform="translate(1150 400)">
    <rect width="310" height="220" rx="24" fill="#171713" stroke="#544c3f" stroke-width="2"/>
    <rect x="26" y="28" width="88" height="88" rx="20" fill="url(#accent)"/>
    <g transform="translate(44 46)" fill="none" stroke="#fff8eb" stroke-width="6" stroke-linejoin="round">
      <path d="M0 20 L26 6 L52 20 L26 34 Z"/>
      <path d="M0 34 L26 48 L52 34"/>
      <path d="M0 48 L26 62 L52 48"/>
    </g>
    <text x="136" y="61" fill="#f2b84b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">WAYLAND</text>
    <text x="136" y="96" fill="#fbf7ef" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Desktop tools</text>
    <line x1="26" y1="145" x2="284" y2="145" stroke="#4b453a"/>
    <text x="26" y="184" fill="#d8d1c5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">layers.svg copied into place</text>
  </g>
  <rect x="1150" y="646" width="310" height="42" rx="21" fill="#4c3514"/>
  <text x="1305" y="674" fill="#ffe7b0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">READY FOR THE TIMELINE</text>

  <text x="100" y="820" fill="#80786c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">No matching tag? The selector used the shared code icon as a valid fallback.</text>
</svg>
