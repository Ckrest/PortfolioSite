blocks:
- body: '## Give every imported update an icon


    Portfolio Editor had created compact updates without an icon, leaving their timeline
    cards with broken or generic presentation. I added a deterministic selector to
    the creation path. It checked domain tags first, skill tags second, and copied
    the selected asset from the shared icon library. When nothing matched, it used
    the shared code icon as a valid fallback.


    Work-type labels such as “Feature” and “Bug Fix” were ignored because they described
    the activity rather than its subject. A one-time backfill assigned icons to 24
    existing updates that lacked them.'
  id: blk_editorial_auto-assign-icons-to-por
  type: text
- description: Domain, skill, and work-type tags passed through a fixed priority order
    before Portfolio Editor copied the selected shared icon into the update.
  id: blk_icon_selection_flow
  presentation: intrinsic
  src: media/tag-icon-selection-flow.svg
  type: image
- body: '## Make the choice repeatable


    The selector lowercased incoming tags, classified them with the shared tag registry,
    and walked fixed priority tables. The mapping order—not the order of the incoming
    tags—decided the winner. An update tagged with both Wayland and Python received
    the desktop-layers icon because a domain match took priority over a skill match.


    Before copying an icon, the selector verified that the selected asset existed
    in the shared library.'
  id: blk_icon_matching
  type: text
- code: '1. Matched a domain tag such as Wayland, ComfyUI, or Audio

    2. Otherwise matched a technology or skill tag

    3. Ignored generic work-type tags

    4. Fell back to the shared code icon'
  description: The priority order favored what the work was about over how the report
    classified the activity.
  filename: selection-priority.txt
  id: blk_icon_priority
  language: text
  presentation: content
  sourceMode: inline
  type: code
- body: '## Preserve editorial control


    Automatic selection ran only when an update did not already have an icon and no
    custom icon path had been provided. Existing choices stayed in place.


    Because the selected SVG was copied into the update during creation, later changes
    to the mapping did not silently rewrite reviewed items. The automatic result remained
    an initial proposal that an editor could replace.'
  id: blk_icon_editorial_control
  type: text
- description: The maintained icon vocabulary and the resulting update cards show
    the deterministic mapping in use.
  fit: contain
  id: blk_ad81c9f4
