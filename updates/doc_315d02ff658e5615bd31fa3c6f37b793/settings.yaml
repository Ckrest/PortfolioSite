blocks:
- body: '## Give every imported update an icon


    Portfolio Editor had created compact updates without an icon, leaving their timeline
    cards with broken or generic presentation. I added a deterministic selector to
    the creation path. It checks domain tags first, skill tags second, and copies
    the selected asset from the shared icon library. When nothing matches, it uses
    the shared code icon as a valid fallback.


    Work-type labels such as “Feature” and “Bug Fix” are ignored because they describe
    the activity rather than its subject. A one-time backfill assigned icons to 24
    existing updates that lacked them.'
  id: blk_editorial_auto-assign-icons-to-por
  type: text
- description: Domain, skill, and work-type tags pass through a fixed priority order
    before Portfolio Editor copies the selected shared icon into the update.
  id: blk_icon_selection_flow
  kind: image
  presentation: intrinsic
  src: media/tag-icon-selection-flow.svg
  type: image
- body: '## Make the choice repeatable


    The selector lowercases incoming tags, classifies them with the shared tag registry,
    and walks fixed priority tables. The mapping order—not the order of the incoming
    tags—decides the winner. An update tagged with both Wayland and Python receives
    the desktop-layers icon because a domain match took priority over a skill match.


    Before copying an icon, the selector verifies that the selected asset exists in
    the shared library.'
  id: blk_icon_matching
  type: text
- code: '1. Matched a domain tag such as Wayland, ComfyUI, or Audio

    2. Otherwise matched a technology or skill tag

    3. Ignored generic work-type tags

    4. Fell back to the shared code icon'
  description: The priority order favors what the work was about over how the report
    classified the activity.
  filename: selection-priority.txt
  id: blk_icon_priority
  language: text
  presentation: content
  sourceMode: inline
  type: code
- body: '## Preserve editorial control


    Automatic selection runs only when an update does not already have an icon and
    no custom icon path has been provided. Existing choices stay in place.


    Because the selected SVG is copied into the update during creation, later changes
    to the mapping do not silently rewrite reviewed items. The automatic result remains
    an initial proposal that an editor can replace.'
  id: blk_icon_editorial_control
  type: text
- description: The maintained icon vocabulary and the resulting update cards show
    the deterministic mapping in use.
  fit: contain
  id: blk_ad81c9f4
