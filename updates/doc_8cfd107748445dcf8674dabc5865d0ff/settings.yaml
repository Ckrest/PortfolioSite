blocks:
- body: '## Decide separately for each fork


    I audited three XFCE components before moving the desktop to the 4.20 line. The
    clipboard manager matched upstream, so I archived it. The panel still required
    three changes: fixed pixel sizes for individual panel items, a configurable show-desktop
    button width, and crash fixes for pointer events during plugin removal. I rebased
    those changes onto XFCE 4.20. The `libxfce4ui` fork stayed because its systemd-scoped
    launcher had no upstream equivalent.'
  id: blk_editorial_migrate-xfce-components-
  type: text
- code: "flowchart TD\n  Audit[Audit each component] --> Difference{Local behavior\
    \ still needed?}\n  Difference -->|No| Archive[Archive unchanged copy]\n  Difference\
    \ -->|Focused patch set| Rebase[Rebase panel onto XFCE 4.20]\n  Difference -->|No\
    \ upstream equivalent| Retain[Keep systemd integration fork]\n  Archive --> Verify[Verify\
    \ migrated desktop session]\n  Rebase --> Verify\n  Retain --> Verify"
  description: The migration disposition followed the actual delta of each component
    rather than one fleet-wide rule.
  id: blk_xfce_migration
  presentation: content
  sourceMode: inline
  type: mermaid
- body: '## Preserve the panel behavior on the new base


    The custom panel loaded its complete plugin set and preserved the compact layout
    and 10-pixel show-desktop button after the rebase. The resulting maintenance boundary
    keeps only the deltas the desktop needs: three panel patches and one systemd integration
    fork.'
  id: blk_xfce_panel_verification
  type: text
date: '2026-01-17'
prominence: low
summary: Archived an unchanged clipboard-manager copy, rebased three focused panel
  patches onto XFCE 4.20, and retained the systemd-scope integration that still had
  no upstream equivalent.
tags:
- XFCE
